<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prep Palestra · Meerkat</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meerkat Prep">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0f0f">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f0f;--surface:#1c1b1a;--surface2:#2e2b28;
    --border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.26);
    --text:#f0ede8;--text2:#b0aca2;--text3:#857f74;
    --accent:#ff8f3f;--accent-dim:rgba(255,143,63,0.14);--accent-dim2:rgba(255,143,63,0.07);
    --red:#ff6b6b;--red-dim:rgba(255,107,107,0.1);
    --green:#8fd694;--green-dim:rgba(143,214,148,0.12);
    --radius:14px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overflow-x:hidden;max-width:100%;}
  @supports(padding:max(0px)){
    .header,.container,.footer{
      padding-left:max(20px,env(safe-area-inset-left));
      padding-right:max(20px,env(safe-area-inset-right));
    }
    .footer{padding-bottom:max(32px,env(safe-area-inset-bottom));}
  }
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  .header{width:100%;max-width:480px;padding:28px 20px 0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
  .headline{font-size:24px;font-weight:600;line-height:1.2;color:var(--text);margin-top:6px;}
  .subline{font-size:13px;color:var(--text2);line-height:1.6;margin-top:4px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(0.8)}}
  .logo-text{font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);font-family:'DM Mono',monospace;}
  .container{width:100%;max-width:480px;padding:20px;display:flex;flex-direction:column;gap:14px;flex:1;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .card-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .card-title{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--text2);font-family:'DM Mono',monospace;}
  .card-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
  .badge{font-size:11px;font-weight:500;font-family:'DM Mono',monospace;padding:3px 9px;border-radius:20px;}
  .badge-ok{background:var(--green-dim);color:var(--green);border:1px solid rgba(143,214,148,0.25);}
  .badge-off{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}

  .presenza-btn{width:100%;padding:16px;border-radius:var(--radius-sm);border:1px solid rgba(255,143,63,0.35);background:var(--accent-dim2);color:var(--accent);font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.18s;}
  .presenza-btn:hover{background:var(--accent-dim);}
  .presenza-btn.done{background:var(--green-dim);border-color:rgba(143,214,148,0.35);color:var(--green);cursor:default;}

  .field{display:flex;flex-direction:column;gap:4px;}
  .field-label{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;letter-spacing:0.04em;}
  .field-input,.field-textarea{width:100%;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:16px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.15s;-webkit-appearance:none;}
  .field-input:focus,.field-textarea:focus{border-color:rgba(255,143,63,0.4);}
  .field-input::placeholder{color:var(--text3);}
  .field-row{display:flex;gap:8px;}
  .field-row .field{flex:1;}

  .ex-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--border);align-items:end;}
  .ex-row:last-of-type{border-bottom:none;}
  .ex-row input{width:100%;padding:7px 8px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;min-width:0;-webkit-appearance:none;}
  .ex-row input:focus{border-color:rgba(255,143,63,0.4);}
  .ex-lbl{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase;margin-bottom:3px;display:block;}
  .ex-del{background:transparent;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:0 4px;}
  .ex-del:hover{color:var(--red);}

  .add-ex-btn{padding:9px;border-radius:var(--radius-sm);border:1px dashed var(--border2);background:var(--surface2);color:var(--text2);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;text-align:center;transition:all 0.18s;}
  .add-ex-btn:hover{border-color:rgba(255,143,63,0.35);color:var(--accent);background:var(--accent-dim2);}

  .save-btn{width:100%;padding:12px;border-radius:var(--radius-sm);background:var(--accent);color:#0f0f0f;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;border:none;cursor:pointer;transition:opacity 0.15s;}
  .save-btn:hover{opacity:0.85;}
  .save-btn:disabled{opacity:0.35;cursor:not-allowed;}
  .save-flash{background:var(--green)!important;}

  .storico-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .storico-item:last-child{border-bottom:none;}
  .storico-main{display:flex;flex-direction:column;gap:2px;}
  .storico-sessione{font-size:13px;color:var(--text);}
  .storico-data{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
  .storico-count{font-size:11px;color:var(--accent);font-family:'DM Mono',monospace;white-space:nowrap;}
  .empty-msg{font-size:12px;color:var(--text3);text-align:center;padding:14px 0;font-family:'DM Mono',monospace;}

  .error-box{width:100%;max-width:480px;margin:40px 20px;padding:20px;background:var(--surface);border:1px solid var(--red-dim);border-radius:var(--radius);text-align:center;color:var(--text2);font-size:14px;line-height:1.6;}

  .footer{width:100%;max-width:480px;padding:16px 20px 32px;text-align:center;font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
</style>
</head>
<body>

<div id="app" style="width:100%;display:flex;flex-direction:column;align-items:center;">
<div class="header">
  <div class="logo">
    <div class="logo-dot"></div>
    <span class="logo-text">ASD Basket Scicli Meerkat</span>
  </div>
  <h1 class="headline" id="headline">Preparazione Palestra</h1>
  <p class="subline" id="subline">Caricamento profilo...</p>
</div>

<div class="container">

  <div class="card">
    <div class="card-header">
      <span class="card-title">Presenza oggi</span>
      <span class="badge badge-off" id="presenza-badge">—</span>
    </div>
    <div class="card-body">
      <button class="presenza-btn" id="presenza-btn" onclick="markPresenza()">Segna presenza di oggi</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Log allenamento forza</span>
    </div>
    <div class="card-body">
      <div class="field-row">
        <div class="field">
          <span class="field-label">Sessione</span>
          <input type="text" class="field-input" id="input-sessione" placeholder="es. Forza gambe">
        </div>
        <div class="field" style="max-width:110px;">
          <span class="field-label">Durata (min)</span>
          <input type="number" class="field-input" id="input-durata" placeholder="45" min="0" max="240">
        </div>
      </div>

      <div id="ex-rows"></div>
      <button class="add-ex-btn" onclick="addExRow()">+ Esercizio</button>

      <div class="field">
        <span class="field-label">Note</span>
        <textarea class="field-textarea" id="input-note" placeholder="note generali sulla sessione (opzionale)" style="height:50px;resize:none;"></textarea>
      </div>

      <button class="save-btn" id="save-btn" onclick="salvaAllenamento()">Salva allenamento</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Storico recente</span>
    </div>
    <div class="card-body" id="storico-list">
      <div class="empty-msg">Caricamento...</div>
    </div>
  </div>

</div>

<div class="footer">ASD Basket Scicli Meerkat · preparazione atletica</div>
</div>

<script>
const FB_URL = 'https://casa-manager-24414-default-rtdb.europe-west1.firebasedatabase.app';

let playerId = '';
let profilo = null;

function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
}

function todayStr() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function showLinkError() {
  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="logo"><div class="logo-dot"></div><span class="logo-text">ASD Basket Scicli Meerkat</span></div>
    </div>
    <div class="error-box">Link non valido o giocatore non trovato.<br>Contatta lo staff per ricevere il tuo link personale.</div>`;
}

async function initSession() {
  const params = new URLSearchParams(window.location.search);
  const g = params.get('giocatore');
  if(!g || !g.trim()) { showLinkError(); return; }
  playerId = slugify(g.trim());

  try {
    const res = await fetch(FB_URL + '/basket_roster/' + playerId + '.json');
    profilo = await res.json();
  } catch(e) { profilo = null; }

  if(!profilo || !profilo.nome) { showLinkError(); return; }

  document.getElementById('headline').textContent = 'Ciao, ' + profilo.nome;
  const metaBits = [profilo.ruolo, profilo.altezza_cm ? profilo.altezza_cm+' cm' : null, profilo.peso_kg ? profilo.peso_kg+' kg' : null].filter(Boolean);
  document.getElementById('subline').textContent = metaBits.length ? metaBits.join(' · ') : 'Preparazione atletica in palestra';

  addExRow();
  checkPresenza();
  loadStorico();
}

// ─── PRESENZA ───────────────────────────────────────────────

async function checkPresenza() {
  try {
    const res = await fetch(FB_URL + '/basket_presenze/' + playerId + '/' + todayStr() + '.json');
    const data = await res.json();
    setPresenzaUI(!!(data && data.presente));
  } catch(e) {}
}

function setPresenzaUI(done) {
  const btn = document.getElementById('presenza-btn');
  const badge = document.getElementById('presenza-badge');
  if(done) {
    btn.textContent = '✓ Presenza registrata';
    btn.classList.add('done');
    badge.textContent = 'presente';
    badge.className = 'badge badge-ok';
  } else {
    btn.textContent = 'Segna presenza di oggi';
    btn.classList.remove('done');
    badge.textContent = 'non registrata';
    badge.className = 'badge badge-off';
  }
}

async function markPresenza() {
  await fetch(FB_URL + '/basket_presenze/' + playerId + '/' + todayStr() + '.json', {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ data: todayStr(), presente: true, ts: Date.now() })
  }).catch(()=>{});
  setPresenzaUI(true);
}

// ─── LOG ALLENAMENTO ────────────────────────────────────────

function addExRow() {
  const wrap = document.getElementById('ex-rows');
  const row = document.createElement('div');
  row.className = 'ex-row';
  row.innerHTML = `
    <div><span class="ex-lbl">Esercizio</span><input type="text" placeholder="es. Squat"></div>
    <div><span class="ex-lbl">Serie</span><input type="number" min="0" max="20"></div>
    <div><span class="ex-lbl">Rip</span><input type="number" min="0" max="100"></div>
    <div style="display:flex;gap:4px;align-items:end;"><input type="number" min="0" max="500" step="0.5" placeholder="kg" style="flex:1;"><button class="ex-del" onclick="this.closest('.ex-row').remove()">✕</button></div>`;
  wrap.appendChild(row);
}

async function salvaAllenamento() {
  const sessione = document.getElementById('input-sessione').value.trim();
  const durata_min = parseInt(document.getElementById('input-durata').value) || 0;
  const note_generali = document.getElementById('input-note').value.trim();

  const rows = document.querySelectorAll('#ex-rows .ex-row');
  const esercizi = [];
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input');
    const nome = inputs[0].value.trim();
    if(!nome) return;
    esercizi.push({
      nome,
      serie: parseInt(inputs[1].value) || 0,
      rip: parseInt(inputs[2].value) || 0,
      carico_kg: parseFloat(inputs[3].value) || 0
    });
  });

  if(esercizi.length === 0) { alert('Aggiungi almeno un esercizio con il nome compilato.'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  const payload = { data: todayStr(), sessione: sessione || 'Allenamento', durata_min, esercizi, note_generali };

  try {
    await fetch(FB_URL + '/basket_allenamenti/' + playerId + '/' + Date.now() + '.json', {
      method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
    });
    await markPresenza();

    document.getElementById('input-sessione').value = '';
    document.getElementById('input-durata').value = '';
    document.getElementById('input-note').value = '';
    document.getElementById('ex-rows').innerHTML = '';
    addExRow();

    btn.classList.add('save-flash');
    btn.textContent = '✓ Salvato';
    setTimeout(()=>{ btn.classList.remove('save-flash'); btn.textContent='Salva allenamento'; btn.disabled=false; }, 1800);

    loadStorico();
  } catch(e) {
    btn.disabled = false;
    alert('Errore di salvataggio, riprova.');
  }
}

// ─── STORICO ────────────────────────────────────────────────

async function loadStorico() {
  const el = document.getElementById('storico-list');
  try {
    const res = await fetch(FB_URL + '/basket_allenamenti/' + playerId + '.json');
    const data = await res.json();
    if(!data) { el.innerHTML = '<div class="empty-msg">Nessuna sessione registrata</div>'; return; }
    const entries = Object.values(data).filter(e=>e && e.data).sort((a,b)=>(b.data||'').localeCompare(a.data||'')).slice(0,5);
    if(entries.length === 0) { el.innerHTML = '<div class="empty-msg">Nessuna sessione registrata</div>'; return; }
    el.innerHTML = entries.map(e => `
      <div class="storico-item">
        <div class="storico-main">
          <span class="storico-sessione">${e.sessione||'Allenamento'}</span>
          <span class="storico-data">${e.data}${e.durata_min?' · '+e.durata_min+' min':''}</span>
        </div>
        <span class="storico-count">${(e.esercizi||[]).length} es.</span>
      </div>`).join('');
  } catch(e) {
    el.innerHTML = '<div class="empty-msg">Errore caricamento storico</div>';
  }
}

initSession();
</script>
</body>
</html>
