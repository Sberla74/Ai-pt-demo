<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prep Palestra · Meerkat</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meerkat Prep">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f1ea">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f1ea;--surface:#1c1b1a;--surface2:#2e2b28;
    --border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.26);
    --text:#f0ede8;--text2:#b0aca2;--text3:#857f74;
    --page-text:#211d18;--page-text2:#5c564c;
    --accent:#ff8f3f;--accent-on-light:#b8560f;--accent-dim:rgba(255,143,63,0.14);--accent-dim2:rgba(255,143,63,0.07);
    --red:#ff6b6b;--red-dim:rgba(255,107,107,0.1);
    --green:#8fd694;--green-dim:rgba(143,214,148,0.12);
    --radius:14px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overflow-x:hidden;max-width:100%;}
  @supports(padding:max(0px)){
    .header,.container,.footer{
      padding-left:max(20px,env(safe-area-inset-left));
      padding-right:max(20px,env(safe-area-inset-right));
    }
    .footer{padding-bottom:max(32px,env(safe-area-inset-bottom));}
  }
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  .header{width:100%;max-width:480px;padding:28px 20px 0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
  .headline{font-size:24px;font-weight:600;line-height:1.2;color:var(--page-text);margin-top:6px;}
  .subline{font-size:13px;color:var(--page-text2);line-height:1.6;margin-top:4px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(0.8)}}
  .logo-text{font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-on-light);font-family:'DM Mono',monospace;}
  .container{width:100%;max-width:480px;padding:20px;display:flex;flex-direction:column;gap:14px;flex:1;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .card-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .card-title{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--text2);font-family:'DM Mono',monospace;}
  .card-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field-label{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;letter-spacing:0.04em;}
  .field-input,.field-textarea{width:100%;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:16px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.15s;-webkit-appearance:none;}
  .field-input:focus,.field-textarea:focus{border-color:rgba(255,143,63,0.4);}
  .field-input::placeholder{color:var(--text3);}
  .save-btn{width:100%;padding:12px;border-radius:var(--radius-sm);background:var(--accent);color:#0f0f0f;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;border:none;cursor:pointer;transition:opacity 0.15s;}
  .save-btn:hover{opacity:0.85;}
  .save-btn:disabled{opacity:0.35;cursor:not-allowed;}
  .save-flash{background:var(--green)!important;}

  .scheda-giorno-block{margin-top:12px;}
  .scheda-giorno-block:first-of-type{margin-top:0;}
  .scheda-giorno-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--accent-dim2);border:1px solid rgba(255,143,63,0.4);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer;text-align:left;transition:background 0.15s;}
  .scheda-giorno-toggle:active{background:var(--accent-dim);}
  .scheda-giorno-label{font-size:15px;font-weight:700;color:#ffffff;}
  .scheda-giorno-chevron{color:var(--accent);font-size:18px;font-weight:700;transition:transform 0.2s;flex-shrink:0;}
  .scheda-giorno-chevron.open{transform:rotate(180deg);}
  .scheda-giorno-content{padding:14px 2px 10px;}
  .scheda-giorno-note{font-size:11px;color:var(--text3);line-height:1.5;margin-bottom:8px;}
  .scheda-ex-item{padding:14px 0;border-bottom:2px solid rgba(255,255,255,0.22);}
  .scheda-ex-item:last-of-type{border-bottom:none;}
  .scheda-ex-row{display:flex;gap:10px;align-items:flex-start;}
  .scheda-ex-num{display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin-top:2px;border-radius:50%;background:var(--accent-dim);color:var(--accent);font-size:12px;font-weight:700;font-family:'DM Mono',monospace;flex-shrink:0;}
  .scheda-ex-subs{display:flex;flex-direction:column;gap:12px;flex:1;min-width:0;}
  .scheda-ex-sub+.scheda-ex-sub{padding-top:12px;border-top:1px dashed rgba(255,255,255,0.16);}
  .scheda-ex-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .scheda-ex-nome{font-size:17px;font-weight:700;color:#ffffff;line-height:1.3;}
  .scheda-ex-target{font-size:15px;font-weight:600;color:var(--accent);font-family:'DM Mono',monospace;white-space:nowrap;flex-shrink:0;}
  .scheda-ex-note{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5;}
  .scheda-ex-input-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .scheda-ex-input-lbl{font-size:12px;color:var(--text2);font-family:'DM Mono',monospace;font-weight:600;}
  .scheda-kg-input{width:104px;padding:10px 12px;border-radius:var(--radius-sm);border:2px solid var(--accent);background:var(--surface2);color:#ffffff;font-size:19px;font-weight:700;font-family:'DM Mono',monospace;text-align:center;outline:none;-webkit-appearance:none;}
  .scheda-kg-input::placeholder{color:var(--text3);font-weight:400;}
  .scheda-kg-input:focus{background:var(--accent-dim);}
  .scheda-ex-save-btn{padding:11px 16px;border-radius:var(--radius-sm);background:var(--accent);color:#0f0f0f;font-size:14px;font-weight:700;font-family:'DM Sans',sans-serif;border:none;cursor:pointer;flex:1;transition:opacity 0.15s;}
  .scheda-ex-save-btn:hover{opacity:0.85;}
  .scheda-ex-save-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .scheda-ex-save-btn.save-flash{background:var(--green)!important;}

  .storico-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .storico-item:last-child{border-bottom:none;}
  .storico-main{display:flex;flex-direction:column;gap:2px;}
  .storico-sessione{font-size:13px;color:var(--text);}
  .storico-data{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
  .storico-count{font-size:11px;color:var(--accent);font-family:'DM Mono',monospace;white-space:nowrap;}
  .empty-msg{font-size:12px;color:var(--text3);text-align:center;padding:14px 0;font-family:'DM Mono',monospace;}

  .error-box{width:100%;max-width:480px;margin:40px 20px;padding:20px;background:var(--surface);border:1px solid var(--red-dim);border-radius:var(--radius);text-align:center;color:var(--text2);font-size:14px;line-height:1.6;}

  .tabbar{display:flex;gap:8px;width:100%;max-width:480px;padding:16px 20px 0;}
  .tabbtn{flex:1;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;text-align:center;transition:all 0.15s;}
  .tabbtn.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(255,143,63,0.4);}

  .test-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .test-item:last-child{border-bottom:none;}
  .test-data{font-size:12px;color:var(--text2);font-family:'DM Mono',monospace;}
  .test-valore{font-size:14px;font-weight:600;color:var(--accent);font-family:'DM Mono',monospace;white-space:nowrap;}

  .footer{width:100%;max-width:480px;padding:16px 20px 32px;text-align:center;font-size:11px;color:var(--page-text2);font-family:'DM Mono',monospace;}
</style>
</head>
<body>

<div id="app" style="width:100%;display:flex;flex-direction:column;align-items:center;">
<div class="header">
  <div class="logo">
    <div class="logo-dot"></div>
    <span class="logo-text">ASD Basket Scicli Meerkat</span>
  </div>
  <h1 class="headline" id="headline">Preparazione Palestra</h1>
  <p class="subline" id="subline">Caricamento profilo...</p>
</div>

<div class="tabbar">
  <button class="tabbtn active" id="tabbtn-allenamento" onclick="showMainTab('allenamento')">Allenamento</button>
  <button class="tabbtn" id="tabbtn-test" onclick="showMainTab('test')">Test Atletici</button>
</div>

<div class="container" id="view-allenamento">

  <div class="card" id="scheda-card" style="display:none;">
    <div class="card-header">
      <span class="card-title">Scheda Assegnata: Forza</span>
    </div>
    <div class="card-body" id="scheda-body">
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Storico recente</span>
    </div>
    <div class="card-body" id="storico-list">
      <div class="empty-msg">Caricamento...</div>
    </div>
  </div>

</div>

<div class="container" id="view-test" style="display:none;">

  <div class="card">
    <div class="card-header"><span class="card-title">Test Agilità</span></div>
    <div class="card-body" id="test-agilita-list"><div class="empty-msg">Caricamento...</div></div>
  </div>

  <div class="card">
    <div class="card-header"><span class="card-title">Test di Forza</span></div>
    <div class="card-body" id="test-forza-list"><div class="empty-msg">Caricamento...</div></div>
  </div>

  <div class="card">
    <div class="card-header"><span class="card-title">Beep Test</span></div>
    <div class="card-body" id="test-resistenza-list"><div class="empty-msg">Caricamento...</div></div>
  </div>

</div>

<div class="footer">ASD Basket Scicli Meerkat · preparazione atletica</div>
</div>

<script>
const FB_URL = 'https://casa-manager-24414-default-rtdb.europe-west1.firebasedatabase.app';

let playerId = '';
let profilo = null;

function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
}

function todayStr() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function showLinkError() {
  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="logo"><div class="logo-dot"></div><span class="logo-text">ASD Basket Scicli Meerkat</span></div>
    </div>
    <div class="error-box">Link non valido o giocatore non trovato.<br>Contatta lo staff per ricevere il tuo link personale.</div>`;
}

async function initSession() {
  const params = new URLSearchParams(window.location.search);
  const g = params.get('giocatore');
  if(!g || !g.trim()) { showLinkError(); return; }
  playerId = slugify(g.trim());

  try {
    const res = await fetch(FB_URL + '/basket_roster/' + playerId + '.json');
    profilo = await res.json();
  } catch(e) { profilo = null; }

  if(!profilo || !profilo.nome) { showLinkError(); return; }

  document.getElementById('headline').textContent = 'Ciao, ' + profilo.nome;
  const metaBits = [profilo.ruolo, profilo.altezza_cm ? profilo.altezza_cm+' cm' : null, profilo.peso_kg ? profilo.peso_kg+' kg' : null].filter(Boolean);
  document.getElementById('subline').textContent = metaBits.length ? metaBits.join(' · ') : 'Preparazione atletica in palestra';

  loadStorico();
  loadScheda();
  loadTest();
}

// ─── TAB SWITCH ─────────────────────────────────────────────

function showMainTab(tab) {
  document.getElementById('view-allenamento').style.display = tab === 'allenamento' ? 'flex' : 'none';
  document.getElementById('view-test').style.display = tab === 'test' ? 'flex' : 'none';
  document.getElementById('tabbtn-allenamento').classList.toggle('active', tab === 'allenamento');
  document.getElementById('tabbtn-test').classList.toggle('active', tab === 'test');
}

// ─── TEST ATLETICI (sola lettura per il giocatore) ───────────

const TEST_LABELS = { agilita: 'Agilità', forza: 'Forza', resistenza: 'Beep Test' };
const FORZA_ESERCIZI = { squat: 'Squat', stacco: 'Stacco', trazioni: 'Trazioni', lat_machine: 'Lat Machine' };

function formatTestValore(t) {
  if(t.tipo === 'agilita') return (t.tempo_sec||0) + 's';
  if(t.tipo === 'forza') return (FORZA_ESERCIZI[t.esercizio]||'Forza') + ' — ' + (t.carico_kg||0) + 'kg × ' + (t.rip||0);
  if(t.tipo === 'resistenza') return 'Livello ' + (t.livello||0) + (t.descrizione ? ' — ' + t.descrizione : '');
  return '—';
}

async function loadTest() {
  const containers = { agilita: 'test-agilita-list', forza: 'test-forza-list', resistenza: 'test-resistenza-list' };
  try {
    const res = await fetch(FB_URL + '/basket_test/' + playerId + '.json');
    const data = await res.json();
    const entries = data ? Object.values(data).filter(e => e && e.data && e.tipo) : [];
    ['agilita','forza','resistenza'].forEach(tipo => {
      const el = document.getElementById(containers[tipo]);
      const list = entries.filter(e => e.tipo === tipo).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
      if(list.length === 0) { el.innerHTML = '<div class="empty-msg">Nessun test registrato</div>'; return; }
      el.innerHTML = list.map(t => `
        <div class="test-item">
          <span class="test-data">${t.data}</span>
          <span class="test-valore">${formatTestValore(t)}</span>
        </div>`).join('');
    });
  } catch(e) {
    Object.values(containers).forEach(id => { document.getElementById(id).innerHTML = '<div class="empty-msg">Errore caricamento test</div>'; });
  }
}

// ─── SCHEDA ASSEGNATA ───────────────────────────────────────

let schedaCorrente = null;

function groupSchedaEsercizi(esercizi) {
  const groups = [];
  const seenGruppo = new Set();
  esercizi.forEach((ex, exi) => {
    if(ex.gruppo != null) {
      if(seenGruppo.has(ex.gruppo)) return;
      seenGruppo.add(ex.gruppo);
      const members = [];
      esercizi.forEach((e2, i2) => { if(e2.gruppo === ex.gruppo) members.push({ ex: e2, exi: i2 }); });
      groups.push(members);
    } else {
      groups.push([{ ex, exi }]);
    }
  });
  return groups;
}

async function loadScheda() {
  try {
    const res = await fetch(FB_URL + '/basket_schede/' + playerId + '.json');
    const data = await res.json();
    if(!data || !data.giorni || data.giorni.length === 0) return;
    schedaCorrente = data;

    document.getElementById('scheda-card').style.display = 'block';

    const body = document.getElementById('scheda-body');
    body.innerHTML = data.giorni.map((g, i) => {
      const lettera = String.fromCharCode(65 + i);
      return `
      <div class="scheda-giorno-block">
        <button class="scheda-giorno-toggle" onclick="toggleGiorno(this)">
          <span class="scheda-giorno-label">Scheda ${lettera}: ${g.nome || 'Giorno ' + (i+1)}</span>
          <span class="scheda-giorno-chevron${i===0?' open':''}">▾</span>
        </button>
        <div class="scheda-giorno-content" style="display:${i===0?'block':'none'};">
          ${g.note ? `<div class="scheda-giorno-note">${g.note}</div>` : ''}
          ${groupSchedaEsercizi(g.esercizi||[]).map((members, gi) => `
            <div class="scheda-ex-item">
              <div class="scheda-ex-row">
                <span class="scheda-ex-num">${gi+1}</span>
                <div class="scheda-ex-subs">
                  ${members.map(({ex, exi}) => `
                    <div class="scheda-ex-sub">
                      <div class="scheda-ex-top">
                        <span class="scheda-ex-nome">${ex.nome}</span>
                        <span class="scheda-ex-target">${ex.serie||0}×${ex.rip||0}${ex.carico_kg>0?' @ '+ex.carico_kg+'kg':''}</span>
                      </div>
                      ${ex.note ? `<div class="scheda-ex-note">${ex.note}</div>` : ''}
                      <div class="scheda-ex-input-row">
                        <span class="scheda-ex-input-lbl">Kg oggi</span>
                        <input type="number" class="scheda-kg-input" data-ex="${exi}" step="0.5" min="0" placeholder="kg">
                        <button class="scheda-ex-save-btn" onclick="salvaSingoloEsercizio(${i}, this)">Salva</button>
                      </div>
                    </div>`).join('')}
                </div>
              </div>
            </div>`).join('')}
          <div class="field" style="margin-top:10px;">
            <span class="field-label">Note</span>
            <textarea class="field-textarea scheda-giorno-note-input" placeholder="note su questa sessione (opzionale)" style="height:44px;resize:none;"></textarea>
          </div>
        </div>
      </div>`;
    }).join('');
  } catch(e) {}
}

function toggleGiorno(btn) {
  const content = btn.nextElementSibling;
  const chevron = btn.querySelector('.scheda-giorno-chevron');
  const isOpen = content.style.display === 'block';
  content.style.display = isOpen ? 'none' : 'block';
  chevron.classList.toggle('open', !isOpen);
}

async function salvaSingoloEsercizio(giornoIndex, btn) {
  const giorno = schedaCorrente.giorni[giornoIndex];
  const content = btn.closest('.scheda-giorno-content');
  const esercizi = (giorno.esercizi||[]).map((ex, exi) => {
    const input = content.querySelector('.scheda-kg-input[data-ex="'+exi+'"]');
    return {
      nome: ex.nome,
      serie: ex.serie || 0,
      rip: ex.rip || 0,
      carico_kg: input ? (parseFloat(input.value) || 0) : 0
    };
  });
  const noteInput = content.querySelector('.scheda-giorno-note-input');
  const note_generali = noteInput ? noteInput.value.trim() : '';

  // chiave stabile per data+giorno: più salvataggi lo stesso giorno aggiornano la stessa sessione
  const key = todayStr().replace(/-/g,'') + '_g' + giornoIndex;
  const payload = { data: todayStr(), sessione: giorno.nome || 'Allenamento', durata_min: 0, esercizi, note_generali };

  btn.disabled = true;
  const origText = btn.textContent;

  try {
    await fetch(FB_URL + '/basket_allenamenti/' + playerId + '/' + key + '.json', {
      method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
    });
    await markPresenza();

    btn.classList.add('save-flash');
    btn.textContent = '✓';
    setTimeout(()=>{ btn.classList.remove('save-flash'); btn.textContent = origText; btn.disabled = false; }, 1200);

    loadStorico();
  } catch(e) {
    btn.disabled = false;
    alert('Errore di salvataggio, riprova.');
  }
}

// ─── PRESENZA ───────────────────────────────────────────────
// Marcata automaticamente al salvataggio di una scheda (salvaSchedaGiorno), niente più bottone manuale.

async function markPresenza() {
  await fetch(FB_URL + '/basket_presenze/' + playerId + '/' + todayStr() + '.json', {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ data: todayStr(), presente: true, ts: Date.now() })
  }).catch(()=>{});
}

// ─── STORICO ────────────────────────────────────────────────

async function loadStorico() {
  const el = document.getElementById('storico-list');
  try {
    const res = await fetch(FB_URL + '/basket_allenamenti/' + playerId + '.json');
    const data = await res.json();
    if(!data) { el.innerHTML = '<div class="empty-msg">Nessuna sessione registrata</div>'; return; }
    const entries = Object.values(data).filter(e=>e && e.data).sort((a,b)=>(b.data||'').localeCompare(a.data||'')).slice(0,5);
    if(entries.length === 0) { el.innerHTML = '<div class="empty-msg">Nessuna sessione registrata</div>'; return; }
    el.innerHTML = entries.map(e => `
      <div class="storico-item">
        <div class="storico-main">
          <span class="storico-sessione">${e.sessione||'Allenamento'}</span>
          <span class="storico-data">${e.data}${e.durata_min?' · '+e.durata_min+' min':''}</span>
        </div>
        <span class="storico-count">${(e.esercizi||[]).length} es.</span>
      </div>`).join('');
  } catch(e) {
    el.innerHTML = '<div class="empty-msg">Errore caricamento storico</div>';
  }
}

initSession();
</script>
</body>
</html>
