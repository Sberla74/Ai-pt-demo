<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Coach AI</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach AI">
<meta name="theme-color" content="#0f0f0f">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222222;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f0ede8;--text2:#8a8780;--text3:#555350;
  --accent:#c8f564;--accent-dim:rgba(200,245,100,0.12);--accent-dim2:rgba(200,245,100,0.06);
  --red:#ff6b6b;--red-dim:rgba(255,107,107,0.1);--blue:#64b4ff;
  --radius:14px;--radius-sm:8px;
  --hh:56px;--tbh:58px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow:hidden;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}

/* HEADER */
.app-header{position:fixed;top:0;left:0;right:0;z-index:20;height:var(--hh);padding-top:env(safe-area-inset-top);background:rgba(15,15,15,0.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding-left:18px;padding-right:18px;}
.logo{display:flex;align-items:center;gap:8px;}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(0.8)}}
.logo-text{font-size:12px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent);font-family:'DM Mono',monospace;}
.day-badge{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;text-align:right;line-height:1.4;}

/* TAB BAR */
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:20;height:var(--tbh);padding-bottom:env(safe-area-inset-bottom);background:rgba(15,15,15,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;}
.tab-btn{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;cursor:pointer;font-size:9px;font-family:'DM Mono',monospace;letter-spacing:0.05em;text-transform:uppercase;color:var(--text3);transition:color 0.15s;padding:0;}
.tab-btn.active{color:var(--accent);}
.tab-indicator{width:18px;height:2px;border-radius:1px;background:transparent;transition:background 0.15s;margin-bottom:1px;}
.tab-btn.active .tab-indicator{background:var(--accent);}

/* TAB CONTENT */
.tab-content{position:fixed;top:var(--hh);bottom:var(--tbh);left:0;right:0;overflow:hidden;display:none;flex-direction:column;}
.tab-content.active{display:flex;}
.tab-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;display:flex;flex-direction:column;gap:12px;}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.card-header{padding:11px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--text2);font-family:'DM Mono',monospace;}
.card-body{padding:13px 15px;}
.label-sm{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;display:block;margin-bottom:3px;}
.num-input{width:100%;padding:8px 6px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:16px;font-family:'DM Mono',monospace;outline:none;-webkit-appearance:none;text-align:center;touch-action:manipulation;}
.num-input:focus{border-color:rgba(200,245,100,0.4);}
.text-input{width:100%;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:16px;font-family:'DM Sans',sans-serif;outline:none;-webkit-appearance:none;touch-action:manipulation;}
.text-input:focus{border-color:rgba(200,245,100,0.4);}
.text-input::placeholder{color:var(--text3);}
.save-btn{padding:9px 20px;border-radius:var(--radius-sm);background:var(--accent);color:#0f0f0f;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;border:none;cursor:pointer;}
.save-btn:active{opacity:0.8;}
.no-data{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;padding:6px 0;}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);font-family:'DM Mono',monospace;}
.tag.good{background:var(--accent-dim);color:var(--accent);border-color:rgba(200,245,100,0.2);}

/* ═══ CHAT TAB ═══ */
#tab-chat{padding:0;}
.chat-msgs{flex:1;min-height:0;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;}
.chat-msgs::-webkit-scrollbar{width:0;}
.msg{display:flex;flex-direction:column;max-width:85%;}
.msg.user{align-self:flex-end;align-items:flex-end;}
.msg.bot{align-self:flex-start;align-items:flex-start;}
.bubble{padding:9px 13px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.msg.user .bubble{background:var(--accent);color:#0f0f0f;border-radius:16px 16px 4px 16px;}
.msg.bot .bubble{background:var(--surface2);color:var(--text);border-radius:16px 16px 16px 4px;border:1px solid var(--border);}
.msg-time{font-size:10px;color:var(--text3);margin-top:3px;font-family:'DM Mono',monospace;}
.msg-foto{width:100px;border-radius:10px;margin-bottom:4px;opacity:0.8;}
.escalate-banner{display:none;margin:0 12px 6px;padding:7px 12px;border-radius:var(--radius-sm);background:var(--red-dim);border:1px solid rgba(255,107,107,0.2);font-size:12px;color:var(--red);font-family:'DM Mono',monospace;flex-shrink:0;}
.suggestions{padding:6px 10px;display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}
.sug{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.sug:active{color:var(--accent);}
.input-row{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--border);flex-shrink:0;}
.input-row textarea{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;padding:8px 11px;resize:none;height:38px;outline:none;line-height:1.4;transition:border-color 0.15s;}
.input-row textarea:focus{border-color:rgba(200,245,100,0.35);}
.send-btn{padding:0 16px;height:38px;border-radius:var(--radius-sm);background:var(--accent);color:#0f0f0f;font-size:14px;font-weight:600;border:none;cursor:pointer;flex-shrink:0;}
.send-btn:disabled{opacity:0.4;}
.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text3);margin:0 2px;animation:bounce 1.2s ease-in-out infinite;}
.typing span:nth-child(2){animation-delay:0.2s;}
.typing span:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}

/* ═══ PASTI TAB ═══ */
.pasti-total{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;}
.pt-val{font-size:17px;font-weight:600;line-height:1;}
.pt-label{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px;}
.pt-ok{color:var(--accent);}.pt-over{color:var(--red);}.pt-low{color:var(--text2);}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.meal-target-row{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:10px;line-height:1.5;}
.meal-saved-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.chip{font-size:11px;font-family:'DM Mono',monospace;padding:3px 9px;border-radius:20px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(200,245,100,0.2);}
.chip.neutral{background:var(--surface2);color:var(--text2);border-color:var(--border);}
.saved-badge{font-size:10px;color:var(--accent);font-family:'DM Mono',monospace;}
.meal-desc-saved{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:5px;font-style:italic;}

/* ═══ FOTO SECTION (top of Chat) ═══ */
.foto-section{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.foto-pair{display:flex;gap:10px;flex-shrink:0;}
.foto-slot-sm{display:flex;flex-direction:column;align-items:center;gap:3px;}
.foto-thumb-sm{width:50px;height:67px;border-radius:var(--radius-sm);border:1px dashed var(--border2);background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;touch-action:manipulation;}
.foto-thumb-sm img{width:100%;height:100%;object-fit:cover;}
.foto-label-sm{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.04em;}
.foto-placeholder-sm{font-size:18px;color:var(--text3);}
.ai-btn{flex:1;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid rgba(200,245,100,0.25);background:var(--accent-dim2);color:var(--accent);font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;touch-action:manipulation;line-height:1.4;}
.ai-btn:disabled{opacity:0.3;cursor:not-allowed;}

/* ═══ MACRO PREVIEW (Pasti) ═══ */
.macro-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 0;}
.mp-item{text-align:center;}
.mp-lbl{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;display:block;margin-bottom:3px;text-transform:uppercase;}
.mp-val{font-size:17px;font-weight:600;color:var(--accent);}
.mp-kcal .mp-val{color:var(--text2);}
.outline-btn{padding:9px 16px;border-radius:var(--radius-sm);background:transparent;border:1px solid var(--border2);color:var(--text2);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;touch-action:manipulation;}
.outline-btn:active{opacity:0.7;}

/* ═══ PESO TAB ═══ */
.peso-big{font-size:44px;font-weight:600;line-height:1;color:var(--text);}
.peso-unit{font-size:20px;color:var(--text2);}
.peso-sub{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:3px;}
.tag-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.peso-history-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
.peso-history-row:last-child{border-bottom:none;}
.peso-date{color:var(--text3);font-family:'DM Mono',monospace;font-size:11px;}
.peso-val{font-weight:500;font-size:14px;}
.peso-delta{font-size:10px;font-family:'DM Mono',monospace;margin-left:4px;}

/* ═══ SONNO TAB ═══ */
.sonno-big{font-size:40px;font-weight:600;line-height:1;}
.sonno-unit{font-size:18px;color:var(--text2);}
.sonno-sub{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:3px;}
.quality-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-family:'DM Mono',monospace;margin-left:6px;vertical-align:middle;}
.quality-badge.ottimo{background:var(--accent-dim);color:var(--accent);}
.quality-badge.buono{background:rgba(100,180,255,0.1);color:var(--blue);}
.quality-badge.scarso{background:var(--red-dim);color:var(--red);}
.sonno-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 10px;}
.sonno-select{width:100%;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:16px;font-family:'DM Sans',sans-serif;outline:none;-webkit-appearance:none;touch-action:manipulation;}
.sonno-select:focus{border-color:rgba(200,245,100,0.4);}
.week-sonno-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
.week-sonno-row:last-child{border-bottom:none;}
.week-day-name{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;width:28px;flex-shrink:0;}
.week-day-val{font-size:13px;font-weight:500;}
.week-day-none{color:var(--text3);font-size:12px;font-family:'DM Mono',monospace;}
.week-avg{display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:4px;border-top:1px solid var(--border2);}
.week-avg-label{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;}
.week-avg-val{font-size:20px;font-weight:600;color:var(--accent);}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--tbh) + 14px);left:50%;transform:translateX(-50%) translateY(10px);background:var(--accent);color:#0f0f0f;font-size:12px;font-weight:600;font-family:'DM Mono',monospace;padding:8px 20px;border-radius:20px;opacity:0;transition:opacity 0.22s,transform 0.22s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<!-- PASTI -->
<div class="tab-content" id="tab-pasti">

<!-- SONNO -->
<div class="tab-content" id="tab-sonno">

</div>

<nav class="tab-bar">

</nav>

B1: Lat machine presa neutra 3×10 (2-1-1-1, RIR 2) → 15-30" → B2: Hip thrust macchina 2×10-12 (RIR 2-3) → 60-75"
Core: Pallof press 2×10 per lato

FULL BODY 2 — Posteriori + Spalle:
A1: Split squat assistito 3×8 per lato (RIR 2-3) → A2: Rematore macchina petto supportato 3×10 (RIR 2) → 75-90"
B1: Shoulder press macchina 2×8-10 (RIR 2) → B2: Leg curl seduto 3×10-12 (RIR 1-2) → 60-75"
Core: Dead bug 2×8 per lato

FULL BODY 3 — Volume Moderato:
A1: Goblet squat a box 3×8-10 (RIR 2-3) → A2: Panca inclinata manubri 3×8-10 (RIR 2) → 75"
B1: Pulley basso busto stabile 3×10 (RIR 2) → B2: Glute bridge 2×12 (RIR 2) → 60-75"
Finisher: Farmer carry leggero 3×25-30 m

FULL BODY 4 — Richiamo Metabolico:
A1: Step-up basso 3×8 per lato (RIR 2-3) → A2: Chest supported row o lat machine 3×10 (RIR 2) → 75-90"
B1: Croci ai cavi o pec deck 2×12 (RIR 1-2) → B2: Alzate laterali 2×12-15 (RIR 1-2) → 60"
Core: Side plank 2×20-35" per lato

HIIT (18-22 min, bike/air bike/ellittica — NO corsa/salti):
5' riscaldamento progressivo → 8-10 round × 20" forte (RPE 8-9) + 70" facile → 3-5' defaticamento

ADDOME SICURO (8-10 min dopo HIIT):
McGill curl-up modificato 2×6-8 tenute 8" | Side plank 2×20-35" per lato | Bird dog 2×6-8 per lato | Pallof press 2×10 per lato

NUTRIZIONE:
Proteine 160-180g/die | Grassi 60-70g/die | Carboidrati 170-220g nei giorni di pesi, 170g riposo
Acqua 2,5-3 L/die | Ogni pasto: proteine + verdure + carbo controllati + grassi misurati
Alcol: max 1-2 occasioni/settimana | Passi: 8.000-10.000/die

PROGRESSIONE:
Sett 1-2 Adattamento | Sett 3-6 Costruzione: +carico graduale | Sett 7-10 Consolidamento | Sett 11 Scarico -30-40% volume | Sett 12 Ripartenza
Aumento carico: quando completi tutte le serie al range alto con RIR corretto → +2,5-5%

STILE DI RISPOSTA:
- Max 5-6 righe di testo (escluse tabella macro e marker NUTRI che sono sempre obbligatori)
- Diretto e aggressivo: sfida Fabrizio, non lo giustifica mai
- Stanco → "Tutti lo sono. Vai."
- Ha sgarrato → analizza, correggi, avanti senza sensi di colpa ma senza passarci sopra
- Ogni risposta finisce con micro-sfida o azione immediata
- Pasto descritto → calcola macro subito con tabella P/C/G/Kcal + delta vs target del giorno
- OBBLIGATORIO — dopo la tabella macro aggiungi SEMPRE su una riga separata: <<NUTRI:TIPO|P|C|G|KCAL>> (TIPO: colazione / spuntino_matt / pranzo / spuntino_pom / cena / spuntino_serale). Solo il marker, nessun testo intorno. MAI ometterlo.

REGOLE HARD:
1) Dolore lombare acuto, sciatalgia, intorpidimento → "→ SCALA AL MEDICO" — stop immediato
2) Non inventare nulla fuori dal piano
3) Tutorial → "Cerca su YouTube: https://www.youtube.com/results?search_query=NOME+ESERCIZIO+tutorial+italiano"`;

// ═══ UTILS ═══
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');}
function now(){return new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});}
function tsISO(){return new Date().toISOString();}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getMonday(d){const day=new Date(d),dow=day.getDay();day.setDate(day.getDate()-(dow===0?6:dow-1));day.setHours(0,0,0,0);return day;}

function getRotationDay(dateStr){
  const start=new Date(ROTATION_START+'T00:00:00');
  const d=new Date((dateStr||todayStr())+'T00:00:00');
  d.setHours(0,0,0,0);start.setHours(0,0,0,0);
  const days=Math.max(0,Math.floor((d-start)/86400000));
  return ROTATION[days%12];
}

function showToast(msg){
  const t=document.getElementById('toast');if(!t)return;
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),3000);
}

function updateDayBadge(){
  const d=new Date();
  const days=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
  const months=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  const rot=getRotationDay();
  const label=rot.label.replace('Full Body','FB');
  document.getElementById('day-badge').innerHTML=days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+'<br><span style="color:var(--accent)">'+label+'</span>';
}

function switchTab(tab){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  if(tab==='pasti') renderPastiTab();
  if(tab==='peso') renderPesoTab();
  if(tab==='sonno') renderSonnoTab();
}

function linkify(text){
  const e=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return e.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" style="color:var(--accent);word-break:break-all;">$1</a>');
}
function addMsg(text,role,fotoUrl){
  const msgs=document.getElementById('msgs');
  const escalate=text.includes('→ SCALA AL TRAINER');
  const clean=text.replace('→ SCALA AL TRAINER','').trim();
  const d=document.createElement('div');
  d.className='msg '+(role==='user'?'user':'bot');
  let html='';
  if(fotoUrl) html+=`<img src="${fotoUrl}" class="msg-foto">`;
  const content=role==='bot'?linkify(clean):clean.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  html+=`<div class="bubble">${content}</div><span class="msg-time">${now()}</span>`;
  d.innerHTML=html;
  msgs.appendChild(d);
  document.getElementById('escalate-banner').style.display=escalate?'block':'none';
  msgs.scrollTop=msgs.scrollHeight;
}
function showTyping(){
  const msgs=document.getElementById('msgs');
  const d=document.createElement('div');
  d.className='msg bot';d.id='typing-msg';
  d.innerHTML='<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}
function removeTyping(){const t=document.getElementById('typing-msg');if(t)t.remove();}

async function getNutriLog(){
  const key=slugify(trainerName)+'_'+slugify(clienteName);
  try{
    const res=await fetch(FB_URL+'/coach_ai_nutri/'+key+'/'+todayStr()+'.json');
    const data=await res.json();if(!data)return'';
    const byPasto={};
    Object.values(data).forEach(m=>{const tp=m.tipo_pasto||'';if(!byPasto[tp]||m.ts>byPasto[tp].ts)byPasto[tp]=m;});
    let log='\n\nPASTI DI OGGI già registrati:\n';
    let totP=0,totC=0,totG=0,totK=0;
    Object.values(byPasto).forEach(p=>{
      const desc=p.descrizione?` (${p.descrizione})`:'';
      log+=`- ${p.tipo_pasto}${desc}: P=${p.proteine}g C=${p.carbo}g G=${p.grassi}g kcal=${p.kcal}\n`;
      totP+=p.proteine||0;totC+=p.carbo||0;totG+=p.grassi||0;totK+=p.kcal||0;
    });
    log+=`TOTALE OGGI: P=${totP}g C=${totC}g G=${totG}g kcal=${totK}`;
    return log;
  }catch(e){return'';}
}
async function getSonnoLog(){
  const key=slugify(trainerName)+'_'+slugify(clienteName);
  try{
    const res=await fetch(FB_URL+'/coach_ai_sonno/'+key+'/'+todayStr()+'.json');
    const s=await res.json();if(!s||!s.ore)return'';
    return`\n\nSONNO STANOTTE: ${s.ore}h${s.qualita?' ('+s.qualita+')':''}`;
  }catch(e){return'';}
}
async function getTrainingLog(){
  const key=slugify(trainerName)+'_'+slugify(clienteName);
  try{
    const res=await fetch(FB_URL+'/coach_ai_log/'+key+'.json');
    const data=await res.json();if(!data)return'';
    const entries=Object.values(data).sort((a,b)=>new Date(b.data||0)-new Date(a.data||0));
    const last=entries.find(e=>e.esercizi&&e.esercizi.length>0);
    if(!last)return'';
    const exNames=last.esercizi.map(e=>e.nome).filter(Boolean).slice(0,4).join(', ');
    return`\n\nULTIMO ALLENAMENTO: ${last.sessione||last.tipo||'?'} il ${last.data||'?'} (${exNames})`;
  }catch(e){return'';}
}
async function getSystemWithLog(){
  const [log,nutriLog,sonnoLog]=await Promise.all([getTrainingLog(),getNutriLog(),getSonnoLog()]);
  const macroTarget=`\n\nMACRO TARGET GIORNALIERI:\nFB: P170 C210 G65 ~2050kcal | HIIT: P170 C185 G65 ~1950kcal | Riposo: P170 C170 G65 ~1850kcal`;
  return DEMO_SYSTEM+log+macroTarget+nutriLog+sonnoLog;
}

async function callAI(text,extraContent){
  busy=true;document.getElementById('send-btn').disabled=true;showTyping();
  const userContent=extraContent||text;
  const system=await getSystemWithLog();
  const allMsgs=[...history,{role:'user',content:userContent}];
  const messages=allMsgs.map(h=>({role:h.role,content:h.content}));
  history.push({role:'user',content:text});
  saveMsg('cliente',text);
  try{
    const res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:800,system,messages})});
    const data=await res.json();
    const rawReply=data.content?.[0]?.text||'Errore nella risposta.';
    const nutriMatch=rawReply.match(/<<NUTRI:(\w+)\|([\d.]+)\|([\d.]+)\|([\d.]+)\|([\d.]+)>>/);
    const reply=rawReply.replace(/<<NUTRI:[^>]+>>/g,'').trim();
    removeTyping();addMsg(reply,'bot');
    history.push({role:'assistant',content:reply});
    saveMsg('agente',reply);saveSessione();
    if(nutriMatch)salvaFromMarker(nutriMatch);
    setTimeout(()=>estraiLog(text),800);
  }catch(e){removeTyping();addMsg('Errore di connessione. Controlla la rete e riprova.','bot');}
  busy=false;document.getElementById('send-btn').disabled=false;
}

function send(){
  const txt=document.getElementById('txt');const v=txt.value.trim();
  if(!v||busy)return;txt.value='';
  document.getElementById('escalate-banner').style.display='none';
  addMsg(v,'user');callAI(v);
}
function useSug(btn){
  if(busy)return;
  document.getElementById('escalate-banner').style.display='none';
  addMsg(btn.textContent,'user');callAI(btn.textContent);
}

// ═══ SALVA NUTRI DA MARKER CHAT ═══
async function salvaFromMarker(match){
  if(!clienteName||trainerName==='demo')return;
  const[,tipo_pasto,p,c,g,k]=match;
  const key=slugify(trainerName)+'_'+slugify(clienteName);
  const logKey=tipo_pasto+'_'+Date.now();
  try{
    const res=await fetch(FB_URL+'/coach_ai_nutri/'+key+'/'+todayStr()+'/'+logKey+'.json',{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tipo_pasto,proteine:Math.round(+p),carbo:Math.round(+c),grassi:Math.round(+g),kcal:Math.round(+k),ts:tsISO(),trainer:trainerName,cliente:clienteName})
    });
    if(res.ok)showToast('✓ '+tipo_pasto.replace('_',' ')+' tracciata');
  }catch(e){}
}

async function estraiLog(testo){
  if(trainerName==='demo'||!clienteName)return;
  const parole=['allenamento','ho fatto','ho allenato','ho completato','leg press','chest press','lat machine','hip thrust','squat','stacco','rematore','shoulder press','leg curl','split squat','step-up','pallof','bird dog','dead bug','side plank','farmer','hiit','full body','fb1','fb2','fb3','fb4'];
  if(!parole.some(p=>testo.toLowerCase().includes(p)))return;
  try{
    const res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:300,system:'Estrai i dati di allenamento dal messaggio. Rispondi SOLO con JSON: {"sessione":"nome","esercizi":[{"nome":"","serie":0,"rip":0,"carico_kg":0}]}. Se non c\'è allenamento: {"sessione":null,"esercizi":[]}',messages:[{role:'user',content:testo}]})});
    const data=await res.json();
    const txt=data.content?.[0]?.text||'';
    const jsonMatch=txt.match(/\{[\s\S]*\}/);
    if(!jsonMatch)return;
    const log=JSON.parse(jsonMatch[0]);
    if(!log.sessione||!log.esercizi||log.esercizi.length===0)return;
    const key=slugify(trainerName)+'_'+slugify(clienteName);
    fetch(FB_URL+'/coach_ai_log/'+key+'/'+Date.now()+'.json',{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...log,data:todayStr(),ts:tsISO(),trainer:trainerName,cliente:clienteName})
    }).catch(()=>{});
  }catch(e){}
}

async function loadPastiOggi(){
  const key=slugify(trainerName)+'_'+slugify(clienteName);
  try{
    const res=await fetch(FB_URL+'/coach_ai_nutri/'+key+'/'+todayStr()+'.json');
    const data=await res.json();if(!data)return{};
    const byPasto={};
    Object.values(data).forEach(m=>{const tp=m.tipo_pasto||'';if(!byPasto[tp]||m.ts>byPasto[tp].ts)byPasto[tp]=m;});
    return byPasto;
  }catch(e){return{};}
}

async function renderPastiTab(){
  const container=document.getElementById('pasti-container');if(!container)return;
  const rot=getRotationDay();
  const targets=MEAL_TARGETS[rot.type]||MEAL_TARGETS.rest;
  const saved=await loadPastiOggi();
  let totP=0,totC=0,totG=0,totK=0;
  Object.values(saved).forEach(m=>{totP+=m.proteine||0;totC+=m.carbo||0;totG+=m.grassi||0;totK+=m.kcal||0;});
  Object.entries(pastiCalcolati).forEach(([mk,m])=>{if(!saved[mk]){totP+=m.proteine||0;totC+=m.carbo||0;totG+=m.grassi||0;totK+=m.kcal||0;}});
  const tP=170,tC=rot.type==='fb'?210:rot.type==='hiit'?185:170,tG=65,tK=rot.type==='fb'?2050:rot.type==='hiit'?1950:1850;
  function ptCls(v,t){return v>t*1.1?'pt-over':v>=t*0.6?'pt-ok':'pt-low';}
  let html=`<div class="pasti-total">
    <div><div class="pt-val ${ptCls(totP,tP)}">${Math.round(totP)}</div><div class="pt-label">P / ${tP}g</div></div>
    <div><div class="pt-val ${ptCls(totC,tC)}">${Math.round(totC)}</div><div class="pt-label">C / ${tC}g</div></div>
    <div><div class="pt-val ${ptCls(totG,tG)}">${Math.round(totG)}</div><div class="pt-label">G / ${tG}g</div></div>
    <div><div class="pt-val ${ptCls(totK,tK)}">${Math.round(totK)}</div><div class="pt-label">Kcal / ${tK}</div></div>
  </div>`;
  const MEAL_COLORS=['#c8f564','#64b4ff','#ffaa55','#55e6c1','#ff6b6b','#9988cc'];
  MEAL_ORDER.forEach((mk,idx)=>{
    const tgt=targets[mk];const sv=saved[mk];const lbl=MEAL_LABELS[mk];
    const calc=pastiCalcolati[mk];const editing=pastiEditMode.has(mk);
    const col=MEAL_COLORS[idx];
    html+=`<div class="card" style="border-top:2px solid ${col}"><div class="card-header" style="border-bottom-color:rgba(255,255,255,0.06)"><span class="card-title" style="color:${col}">${lbl}</span>${sv&&!editing&&!calc?'<span class="saved-badge">✓</span>':''}</div><div class="card-body">`;
    html+=`<div class="meal-target-row">Target: P${tgt.p}g · C${tgt.c}g · G${tgt.g}g · ${tgt.k}kcal</div>`;
    if(sv&&!editing&&!calc){
      html+=`<div class="meal-saved-chips"><span class="chip">P ${sv.proteine}g</span><span class="chip">C ${sv.carbo}g</span><span class="chip">G ${sv.grassi}g</span><span class="chip">${sv.kcal} kcal</span></div>`;
      if(sv.descrizione)html+=`<div class="meal-desc-saved">${sv.descrizione}</div>`;
      html+=`<button class="outline-btn" style="margin-top:10px;" onclick="editPasto('${mk}')">Modifica</button>`;
    }else if(calc&&!editing){
      html+=`<div class="macro-preview">
        <div class="mp-item"><span class="mp-lbl">Prot</span><span class="mp-val">${calc.proteine}g</span></div>
        <div class="mp-item"><span class="mp-lbl">Carbo</span><span class="mp-val">${calc.carbo}g</span></div>
        <div class="mp-item"><span class="mp-lbl">Grassi</span><span class="mp-val">${calc.grassi}g</span></div>
        <div class="mp-item mp-kcal"><span class="mp-lbl">Kcal</span><span class="mp-val">${calc.kcal}</span></div>
      </div>`;
      if(calc.descrizione)html+=`<div class="meal-desc-saved" style="margin-bottom:10px;">${calc.descrizione}</div>`;
      html+=`<div style="display:flex;gap:8px;"><button class="save-btn" onclick="salvaPasto('${mk}')">Salva</button><button class="outline-btn" onclick="ricalcolaPasto('${mk}')">Ricalcola</button></div>`;
    }else{
      const prefill=(editing&&sv)?escHtml(sv.descrizione||''):'';
      html+=`<input type="text" class="text-input" id="mp-desc-${mk}" placeholder="es. 100g pasta, 150g pollo, 10g olio" value="${prefill}" style="margin-bottom:10px;">`;
      html+=`<button class="save-btn" id="mp-calc-${mk}" onclick="calcolaPasto('${mk}')" style="width:100%;padding:12px;font-size:14px;">Calcola macro</button>`;
    }
    html+=`</div></div>`;
  });
  container.innerHTML=html;
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');}

async function calcolaPasto(mk){
  const descInput=document.getElementById('mp-desc-'+mk);
  const desc=descInput?.value.trim();
  if(!desc){showToast('Scrivi cosa hai mangiato');return;}
  const calcBtn=document.getElementById('mp-calc-'+mk);
  if(calcBtn){calcBtn.textContent='Calcolo...';calcBtn.disabled=true;}
  try{
    const res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:80,
        system:'Calcola macro nutrizionali degli alimenti indicati. Rispondi SOLO con JSON valido: {"proteine":X,"carbo":X,"grassi":X,"kcal":X} (numeri interi, nessun testo aggiuntivo).',
        messages:[{role:'user',content:desc}]})});
    const data=await res.json();
    const txt=data.content?.[0]?.text||'';
    const jsonMatch=txt.match(/\{[\s\S]*?\}/);
    if(!jsonMatch)throw new Error('no json');
    const m=JSON.parse(jsonMatch[0]);
    if(m.proteine==null||m.carbo==null||m.grassi==null||m.kcal==null)throw new Error('invalid');
    pastiCalcolati[mk]={proteine:Math.round(+m.proteine),carbo:Math.round(+m.carbo),grassi:Math.round(+m.grassi),kcal:Math.round(+m.kcal),descrizione:desc};
    pastiEditMode.delete(mk);
    renderPastiTab();
  }catch(e){
    showToast('Errore calcolo — riprova');
    if(calcBtn){calcBtn.textContent='Calcola macro →';calcBtn.disabled=false;}
  }
}

async function salvaPasto(mk){
  const calc=pastiCalcolati[mk];if(!calc)return;
  const key=slugify(trainerName)+'_'+slugify(clienteName);
  const logKey=mk+'_'+Date.now();
  try{
    const res=await fetch(FB_URL+'/coach_ai_nutri/'+key+'/'+todayStr()+'/'+logKey+'.json',{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tipo_pasto:mk,proteine:calc.proteine,carbo:calc.carbo,grassi:calc.grassi,kcal:calc.kcal,descrizione:calc.descrizione,ts:tsISO(),trainer:trainerName,cliente:clienteName})
    });
    if(!res.ok)throw new Error('HTTP '+res.status);
    delete pastiCalcolati[mk];pastiEditMode.delete(mk);
    showToast('✓ '+MEAL_LABELS[mk]+' salvata');
    renderPastiTab();
  }catch(e){showToast('Errore salvataggio');}
}

function editPasto(mk){delete pastiCalcolati[mk];pastiEditMode.add(mk);renderPastiTab();setTimeout(()=>document.getElementById('mp-desc-'+mk)?.focus(),100);}
function ricalcolaPasto(mk){delete pastiCalcolati[mk];renderPastiTab();setTimeout(()=>document.getElementById('mp-desc-'+mk)?.focus(),100);}

function loadFoto(input,tipo){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const url=e.target.result;const base64=url.split(',')[1];const mtype=file.type||'image/jpeg';
    if(tipo==='prima'){fotoPrima={url,base64,mtype};const t=document.getElementById('thumb-prima');if(t)t.innerHTML=`<img src="${url}">`;}
    else{fotoDopo={url,base64,mtype};const t=document.getElementById('thumb-dopo');if(t)t.innerHTML=`<img src="${url}">`;}
    saveFotoToStorage(tipo,base64,mtype);
    const btn=document.getElementById('confronta-btn');if(btn)btn.disabled=!fotoPrima&&!fotoDopo;
  };reader.readAsDataURL(file);
}
function saveFotoToStorage(tipo,base64,mtype){try{localStorage.setItem('coach_foto_'+tipo,JSON.stringify({base64,mtype}));}catch(e){}}
function restoreFotos(){
  ['prima','dopo'].forEach(tipo=>{
    try{
      const saved=localStorage.getItem('coach_foto_'+tipo);if(!saved)return;
      const{base64,mtype}=JSON.parse(saved);const url=`data:${mtype};base64,${base64}`;
      if(tipo==='prima'){fotoPrima={url,base64,mtype};const t=document.getElementById('thumb-prima');if(t)t.innerHTML=`<img src="${url}">`;}
      else{fotoDopo={url,base64,mtype};const t=document.getElementById('thumb-dopo');if(t)t.innerHTML=`<img src="${url}">`;}
    }catch(e){}
  });
  const btn=document.getElementById('confronta-btn');if(btn)btn.disabled=!fotoPrima&&!fotoDopo;
}

async function confrontaFoto(){
  if(busy)return;
  const btn=document.getElementById('confronta-btn');btn.disabled=true;
  let content=[],msgText='';
  if(fotoPrima&&fotoDopo){
    msgText='Analisi confronto prima/dopo';addMsg(msgText,'user',fotoPrima.url);
    content=[{type:'image',source:{type:'base64',media_type:fotoPrima.mtype,data:fotoPrima.base64}},{type:'image',source:{type:'base64',media_type:fotoDopo.mtype,data:fotoDopo.base64}},{type:'text',text:'Prima foto = forma migliore di Fabrizio (standard di riferimento), seconda foto = forma attuale oggi. Confronta brutalmente ma costruttivamente: cosa è cambiato, cosa manca ancora, quanto dista dalla forma migliore. Sii diretto — non mentire per compiacere. Concludi con una sfida concreta per la prossima settimana.'}];
  }else if(fotoPrima){
    msgText='Analisi foto standard';addMsg(msgText,'user',fotoPrima.url);
    content=[{type:'image',source:{type:'base64',media_type:fotoPrima.mtype,data:fotoPrima.base64}},{type:'text',text:'Foto di Fabrizio nella sua forma migliore — il suo standard di riferimento. Analizza composizione corporea: muscoli visibili, definizione, postura. Sii dettagliato e diretto. Finisci con: "Questo è il tuo standard. Tornaci."'}];
  }else{
    msgText='Analisi foto aggiornamento';addMsg(msgText,'user',fotoDopo.url);
    content=[{type:'image',source:{type:'base64',media_type:fotoDopo.mtype,data:fotoDopo.base64}},{type:'text',text:'Foto attuale di Fabrizio. Valuta composizione corporea onestamente. Sii diretto. Finisci con una sfida concreta per la prossima settimana.'}];
  }
  saveMsg('cliente',msgText);busy=true;document.getElementById('send-btn').disabled=true;showTyping();
  try{
    const res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:800,system:DEMO_SYSTEM,messages:[{role:'user',content}]})});
    const data=await res.json();const reply=data.content?.[0]?.text||'Errore.';
    history.push({role:'user',content:msgText});history.push({role:'assistant',content:reply});
    saveMsg('agente',reply);removeTyping();addMsg(reply,'bot');
  }catch(e){removeTyping();addMsg('Errore di connessione. Riprova.','bot');}
  busy=false;document.getElementById('send-btn').disabled=false;btn.disabled=false;
}

// ═══ PESO TAB ═══
async function renderPesoTab(){
  const container=document.getElementById('peso-container');if(!container)return;
  const key=slugify(trainerName)+'_'+slugify(clienteName);
  let pesate=[];
  try{
    const res=await fetch(FB_URL+'/coach_ai_peso/'+key+'.json');
    const data=await res.json();
    if(data)pesate=Object.values(data).filter(e=>e&&e.data&&e.peso!=null&&!isNaN(e.peso)).sort((a,b)=>b.data.localeCompare(a.data));
  }catch(e){}
  const last=pesate[0];
  let html='<div class="card"><div class="card-header"><span class="card-title">Peso settimanale</span></div><div class="card-body">';
  if(last){
    const delta=+(last.peso-90).toFixed(1);const rem=+(last.peso-80).toFixed(1);
    html+=`<div class="peso-big">${last.peso} <span class="peso-unit">kg</span></div>
    <div class="peso-sub">${last.data}</div>
    <div class="tag-row">
      <span class="tag">${delta<0?delta+'kg dall\'inizio':delta===0?'invariato':'+'+delta+'kg'}</span>
      <span class="tag${rem<=3?' good':''}">${rem>0?rem+' kg al target':'TARGET RAGGIUNTO'}</span>
    </div>`;
  }else{html+='<div class="no-data">Nessun peso ancora registrato</div>';}
  html+=`<div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:16px;align-items:end;">
    <div><span class="label-sm">Nuovo peso (kg)</span>
      <input type="number" class="num-input" id="peso-new-input" placeholder="es. 88.5" step="0.1" min="40" max="200" onkeydown="if(event.key==='Enter')logPeso()">
    </div>
    <button class="save-btn" onclick="logPeso()">Salva</button>
  </div>`;
  if(pesate.length>0){
    html+='<div style="margin-top:16px;"><div style="font-size:10px;color:var(--text3);font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Storico</div>';
    pesate.slice(0,8).forEach((p,i)=>{
      const prev=pesate[i+1];
      let deltaStr='';
      if(prev){const d=+(p.peso-prev.peso).toFixed(1);deltaStr=d===0?'':d<0?`<span class="peso-delta" style="color:var(--accent)">${d}</span>`:`<span class="peso-delta" style="color:var(--red)">+${d}</span>`;}
      html+=`<div class="peso-history-row"><span class="peso-date">${p.data}</span><span class="peso-val">${p.peso} kg ${deltaStr}</span></div>`;
    });
    html+='</div>';
  }
  html+='</div></div>';
  container.innerHTML=html;
}

async function logPeso(){
  const input=document.getElementById('peso-new-input');
  const val=parseFloat((input?.value||'').replace(',','.'));
  if(!val||val<40||val>200){input?.focus();return;}
  const key=slugify(trainerName)+'_'+slugify(clienteName);
  try{
    const res=await fetch(FB_URL+'/coach_ai_peso/'+key+'/'+todayStr()+'.json',{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({peso:val,data:todayStr(),ts:tsISO()})
    });
    if(!res.ok)throw new Error('HTTP '+res.status);
    showToast('✓ Peso salvato');renderPesoTab();
  }catch(e){
    if(input){input.style.borderColor='var(--red)';setTimeout(()=>{input.style.borderColor='';},2000);}
  }
}

// ═══ SONNO TAB ═══
async function renderSonnoTab(){
  const container=document.getElementById('sonno-container');if(!container)return;
  const existingDateSel=document.getElementById('sonno-data-sel');
  const targetDate=existingDateSel?existingDateSel.value:todayStr();
  const key=slugify(trainerName)+'_'+slugify(clienteName);
  let allSonno={};
  try{
    const res=await fetch(FB_URL+'/coach_ai_sonno/'+key+'.json');
    const data=await res.json();if(data)allSonno=data;
  }catch(e){}
  const targetSonno=allSonno[targetDate]||null;
  const[ty,tm,td]=targetDate.split('-');
  const dateLabel=td+'/'+tm+'/'+ty;
  const monday=getMonday(new Date());
  const dayNames=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  let totalOre=0,countNotti=0;
  const weekRows=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday);d.setDate(d.getDate()+i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const entry=allSonno[ds]||null;
    weekRows.push({day:dayNames[i],ds,entry});
    if(entry&&entry.ore){totalOre+=parseFloat(entry.ore)||0;countNotti++;}
  }
  const avg=countNotti>0?(totalOre/countNotti).toFixed(1):null;
  function qBadge(q){if(!q)return'';const cls=q==='ottimo'?'ottimo':q==='buono'?'buono':'scarso';return`<span class="quality-badge ${cls}">${q}</span>`;}

  let html=`<div class="card">
    <div class="card-header"><span class="card-title">Registra sonno</span></div>
    <div class="card-body">
    <div style="margin-bottom:12px;"><span class="label-sm">Data</span>
      <input type="date" class="text-input" id="sonno-data-sel" value="${targetDate}" max="${todayStr()}" onchange="renderSonnoTab()" style="font-family:'DM Mono',monospace;">
    </div>
    ${targetSonno?`<div class="sonno-big">${targetSonno.ore}<span class="sonno-unit"> h</span>${qBadge(targetSonno.qualita)}</div><div class="sonno-sub">${dateLabel}</div>`:'<div class="no-data">Non ancora registrato</div>'}
    <div class="sonno-inputs">
      <div><span class="label-sm">Ore dormite</span><input type="number" class="num-input" id="sonno-ore-input" placeholder="es. 7.5" step="0.5" min="2" max="14" value="${targetSonno?.ore||''}" onkeydown="if(event.key==='Enter')logSonno()"></div>
      <div><span class="label-sm">Qualità</span><select class="sonno-select" id="sonno-qualita-input">
        <option value="">—</option>
        <option value="ottimo"${targetSonno?.qualita==='ottimo'?' selected':''}>ottimo</option>
        <option value="buono"${targetSonno?.qualita==='buono'?' selected':''}>buono</option>
        <option value="scarso"${targetSonno?.qualita==='scarso'?' selected':''}>scarso</option>
      </select></div>
    </div>
    <button class="save-btn" onclick="logSonno()">Salva</button>
    </div></div>`;

  html+=`<div class="card">
    <div class="card-header"><span class="card-title">Settimana · riepilogo sonno</span></div>
    <div class="card-body">`;
  weekRows.forEach(({day,entry})=>{
    if(entry&&entry.ore){html+=`<div class="week-sonno-row"><span class="week-day-name">${day}</span><span class="week-day-val">${entry.ore}h${qBadge(entry.qualita)}</span></div>`;}
    else{html+=`<div class="week-sonno-row"><span class="week-day-name">${day}</span><span class="week-day-none">—</span></div>`;}
  });
  html+=`<div class="week-avg">
    <span class="week-avg-label">Media (${countNotti} notti)</span>
    <span class="week-avg-val">${avg?avg+'h':'—'}</span>
  </div></div></div>`;
  container.innerHTML=html;
}

async function logSonno(){
  const oreInput=document.getElementById('sonno-ore-input');
  const dateSel=document.getElementById('sonno-data-sel');
  const targetDate=dateSel?dateSel.value:todayStr();
  const ore=parseFloat(oreInput?.value||'');
  const qualita=document.getElementById('sonno-qualita-input')?.value||'';
  if(!ore||ore<2||ore>14){oreInput?.focus();return;}
  const key=slugify(trainerName)+'_'+slugify(clienteName);
  try{
    const res=await fetch(FB_URL+'/coach_ai_sonno/'+key+'/'+targetDate+'.json',{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ore,qualita,data:targetDate,ts:tsISO()})
    });
    if(!res.ok)throw new Error('HTTP '+res.status);
    showToast('✓ Sonno salvato');renderSonnoTab();
  }catch(e){
    if(oreInput){oreInput.style.borderColor='var(--red)';setTimeout(()=>{oreInput.style.borderColor='';},2000);}
  }
}

// ═══ FIREBASE SESSION ═══
function saveMsg(ruolo,testo){
  const path='/coach_ai_conversations/'+slugify(trainerName)+'/'+slugify(clienteName)+'/'+Date.now()+'.json';
  fetch(FB_URL+path,{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ruolo,testo:testo.substring(0,2000),ts:tsISO(),trainer:trainerName,cliente:clienteName})
  }).catch(()=>{});
}
function saveSessione(){
  const key=slugify(trainerName)+'_'+slugify(clienteName);
  fetch(FB_URL+'/coach_ai_sessioni/'+key+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ts:tsISO(),trainer:trainerName,cliente:clienteName,messaggi:history.slice(-20)})
  }).catch(()=>{});
}
async function loadSessione(){
  const key=slugify(trainerName)+'_'+slugify(clienteName);
  try{
    const res=await fetch(FB_URL+'/coach_ai_sessioni/'+key+'.json');
    const data=await res.json();
    if(!data||!data.ts)return;
    const ore=(Date.now()-new Date(data.ts).getTime())/3600000;
    if(ore>168)return;
    if(data.messaggi&&data.messaggi.length>0){
      history=data.messaggi;
      document.getElementById('msgs').innerHTML='';
      history.forEach(m=>addMsg(m.content,m.role==='user'?'user':'bot'));
      addMsg('Bentornato Fabrizio. Sessione ripristinata. Continua da dove eri rimasto.','bot');
    }
  }catch(e){}
}

// ═══ INIT ═══
function initSession(){
  const params=new URLSearchParams(window.location.search);
  const tn=params.get('trainer');const cn=params.get('cliente');
  trainerName=tn?tn.trim():'fabrizio';
  clienteName=cn?cn.trim():'test';
}

initSession();
updateDayBadge();
restoreFotos();
loadSessione();
</script>
