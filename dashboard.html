<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach AI · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222222;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#f0ede8;--text2:#8a8780;--text3:#555350;--accent:#c8f564;--accent-dim:rgba(200,245,100,0.12);--accent-dim2:rgba(200,245,100,0.06);--red:#ff6b6b;--red-dim:rgba(255,107,107,0.1);--radius:14px;--radius-sm:8px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  /* TOPBAR */
  .topbar{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);position:sticky;top:0;z-index:10;}
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .topbar-title{font-size:14px;font-weight:500;color:var(--accent);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.08em;}
  .topbar-right{display:flex;gap:8px;align-items:center;}
  .tab-btn{padding:5px 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.15s;}
  .tab-btn:hover{color:var(--text);border-color:var(--border2);}
  .tab-btn.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(200,245,100,0.3);}
  .refresh-btn{padding:5px 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.15s;}
  .refresh-btn:hover{color:var(--accent);border-color:rgba(200,245,100,0.3);}

  /* PROGRESSI VIEW */
  #view-prog{padding:20px 24px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}

  /* KPI ROW */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .kpi-val{font-size:26px;font-weight:600;color:var(--accent);line-height:1;}
  .kpi-label{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;margin-top:5px;}
  .kpi-sub{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px;}

  /* CHART CARDS */
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
  .chart-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--text2);font-family:'DM Mono',monospace;margin-bottom:16px;}
  .chart-empty{font-size:13px;color:var(--text3);text-align:center;padding:24px 0;font-family:'DM Mono',monospace;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

  /* MACRO BARS */
  .mbar-item{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
  .mbar-item:last-child{margin-bottom:0;}
  .mbar-header{display:flex;justify-content:space-between;align-items:center;}
  .mbar-label{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;}
  .mbar-val{font-size:11px;color:var(--text);font-family:'DM Mono',monospace;}
  .mbar-track{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
  .mbar-fill{height:100%;border-radius:2px;transition:width 0.6s ease;}
  .mbar-note{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:14px;}

  /* TRAINING WEEK */
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:4px;}
  .day-cell{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .day-name{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;}
  .day-dot{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.2s;}
  .day-dot.done{background:var(--accent-dim);border-color:rgba(200,245,100,0.4);color:var(--accent);}
  .day-dot.rest{background:transparent;border-color:var(--border);color:var(--text3);}
  .day-dot.today{border-color:rgba(200,245,100,0.5);box-shadow:0 0 0 2px rgba(200,245,100,0.12);}
  .day-dot.missed{background:rgba(255,107,107,0.06);border-color:rgba(255,107,107,0.15);color:var(--text3);}
  .day-type{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;text-align:center;line-height:1.3;}

  /* CONVERSAZIONI VIEW */
  #view-conv{height:calc(100vh - 57px);display:none;}
  .layout{display:flex;height:100%;}
  .sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;background:var(--surface);}
  .sidebar-header{padding:14px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--text2);font-family:'DM Mono',monospace;}
  .trainer-group{border-bottom:1px solid var(--border);}
  .trainer-label{padding:10px 16px 6px;font-size:12px;font-weight:500;color:var(--accent);font-family:'DM Mono',monospace;}
  .cliente-item{padding:8px 16px 8px 24px;cursor:pointer;transition:background 0.15s;display:flex;align-items:center;justify-content:space-between;}
  .cliente-item:hover{background:var(--surface2);}
  .cliente-item.active{background:var(--accent-dim);border-left:2px solid var(--accent);}
  .cliente-name{font-size:13px;color:var(--text);}
  .cliente-count{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
  .main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
  .main-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);}
  .conv-header{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
  .conv-title{font-size:15px;font-weight:500;color:var(--text);}
  .conv-meta{font-size:12px;color:var(--text2);margin-top:3px;font-family:'DM Mono',monospace;}
  .conv-msgs{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:10px;}
  .msg-row{display:flex;flex-direction:column;max-width:65%;}
  .msg-row.cliente{align-self:flex-end;align-items:flex-end;}
  .msg-row.agente{align-self:flex-start;align-items:flex-start;}
  .msg-row.sistema{align-self:center;align-items:center;}
  .msg-bubble{padding:9px 13px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
  .msg-row.cliente .msg-bubble{background:var(--accent);color:#0f0f0f;border-radius:16px 16px 4px 16px;}
  .msg-row.agente .msg-bubble{background:var(--surface2);color:var(--text);border-radius:16px 16px 16px 4px;border:1px solid var(--border);}
  .msg-row.sistema .msg-bubble{background:transparent;color:var(--text3);font-size:11px;font-family:'DM Mono',monospace;padding:4px 8px;}
  .msg-row.escalate .msg-bubble{background:var(--red-dim);border-color:rgba(255,107,107,0.2);color:var(--red);}
  .msg-ts{font-size:10px;color:var(--text3);margin-top:3px;font-family:'DM Mono',monospace;}
  .stats-bar{padding:10px 24px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;gap:24px;flex-shrink:0;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat-val{font-size:18px;font-weight:600;color:var(--text);}
  .stat-label{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;}
  .empty-state{color:var(--text3);font-size:13px;text-align:center;margin-top:40px;}

  @media(max-width:768px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .grid-2{grid-template-columns:1fr;}
    .sidebar{width:180px;}
    #view-prog{padding:14px;}
  }
  @media(max-width:480px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .topbar-title{display:none;}
    .day-dot{width:28px;height:28px;font-size:12px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo-dot"></div>
    <span class="topbar-title">Coach AI · Dashboard</span>
  </div>
  <div class="topbar-right">
    <button class="tab-btn active" id="tab-prog" onclick="showTab('prog')">Progressi</button>
    <button class="tab-btn" id="tab-conv" onclick="showTab('conv')">Conversazioni</button>
    <button class="refresh-btn" onclick="reload()">↻ Aggiorna</button>
  </div>
</div>

<!-- PROGRESSI VIEW -->
<div id="view-prog">

  <!-- KPI -->
  <div class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-val" id="kpi-peso">—</div>
      <div class="kpi-label">Peso attuale</div>
      <div class="kpi-sub" id="kpi-peso-data"></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpi-perso" style="color:var(--text);">—</div>
      <div class="kpi-label">Kg persi</div>
      <div class="kpi-sub">da 90 kg</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpi-rimanenti" style="color:var(--text);">—</div>
      <div class="kpi-label">Al target</div>
      <div class="kpi-sub">obiettivo 80 kg</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpi-sessioni" style="color:var(--text);">—</div>
      <div class="kpi-label">Sessioni settimana</div>
      <div class="kpi-sub">target 6/sett.</div>
    </div>
  </div>

  <!-- Peso chart -->
  <div class="chart-card">
    <div class="chart-title">Peso nel tempo · verso 80 kg</div>
    <div id="peso-chart-wrap"><canvas id="pesoChart" height="90"></canvas></div>
  </div>

  <!-- Macro + Allenamenti -->
  <div class="grid-2">
    <div class="chart-card">
      <div class="chart-title">Macro · media ultimi 7 giorni</div>
      <div id="macro-bars"></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Allenamenti · settimana corrente</div>
      <div id="training-week"></div>
    </div>
  </div>

</div>

<!-- CONVERSAZIONI VIEW -->
<div id="view-conv">
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">Trainer · Clienti</div>
      <div id="sidebar-content"><div style="padding:16px;font-size:13px;color:var(--text3);">Caricamento...</div></div>
    </div>
    <div class="main" id="main">
      <div class="main-empty"><p style="font-size:14px;">Seleziona un cliente dalla lista</p></div>
    </div>
  </div>
</div>

<script>
const FB_URL = 'https://casa-manager-24414-default-rtdb.europe-west1.firebasedatabase.app';
const CLIENT_KEY = 'fabrizio_fabrizio';
let allData = {};
let activeKey = null;
let pesoChart = null;

// TAB
function showTab(tab) {
  document.getElementById('view-prog').style.display = tab === 'prog' ? 'flex' : 'none';
  document.getElementById('view-conv').style.display = tab === 'conv' ? 'block' : 'none';
  document.getElementById('tab-prog').className = 'tab-btn' + (tab==='prog'?' active':'');
  document.getElementById('tab-conv').className = 'tab-btn' + (tab==='conv'?' active':'');
}

async function reload() {
  loadProgressi();
  loadConversations();
}

// ─── PROGRESSI ────────────────────────────────────────────

async function loadProgressi() {
  const [peso, nutri, log] = await Promise.all([fetchPeso(), fetchNutri(), fetchLog()]);
  renderKPI(peso, log);
  renderPesoChart(peso);
  renderMacroBars(nutri);
  renderTrainingWeek(log);
}

async function fetchPeso() {
  try {
    const res = await fetch(FB_URL+'/coach_ai_peso/'+CLIENT_KEY+'.json');
    const data = await res.json();
    if(!data) return [];
    return Object.values(data).sort((a,b)=>new Date(a.data)-new Date(b.data));
  } catch(e) { return []; }
}

async function fetchNutri() {
  try {
    const res = await fetch(FB_URL+'/coach_ai_nutri/'+CLIENT_KEY+'.json');
    const data = await res.json();
    if(!data) return {};
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
    const out = {};
    Object.entries(data).forEach(([date,meals])=>{ if(new Date(date)>=cutoff) out[date]=meals; });
    return out;
  } catch(e) { return {}; }
}

async function fetchLog() {
  try {
    const res = await fetch(FB_URL+'/coach_ai_log/'+CLIENT_KEY+'.json');
    const data = await res.json();
    return data ? Object.values(data) : [];
  } catch(e) { return []; }
}

function getMonday(d) {
  const day = new Date(d); const dow = day.getDay();
  day.setDate(day.getDate() - (dow===0?6:dow-1)); day.setHours(0,0,0,0);
  return day;
}

// KPI
function renderKPI(peso, log) {
  const last = peso[peso.length-1];
  if(last) {
    const perso = +(90-last.peso).toFixed(1);
    const rimanenti = +(last.peso-80).toFixed(1);
    document.getElementById('kpi-peso').textContent = last.peso+' kg';
    document.getElementById('kpi-peso-data').textContent = last.data;
    const persoEl = document.getElementById('kpi-perso');
    persoEl.textContent = perso>0 ? '-'+perso+' kg' : perso<0 ? '+'+Math.abs(perso)+' kg' : '0 kg';
    persoEl.style.color = perso>0 ? 'var(--accent)' : 'var(--red)';
    const rimEl = document.getElementById('kpi-rimanenti');
    rimEl.textContent = rimanenti>0 ? rimanenti+' kg' : '🎯 TARGET!';
    rimEl.style.color = rimanenti<=2 ? 'var(--accent)' : 'var(--text)';
  }
  const monday = getMonday(new Date());
  const sessioni = log.filter(e=>e.data&&new Date(e.data)>=monday&&e.esercizi&&e.esercizi.length>0).length;
  const sessEl = document.getElementById('kpi-sessioni');
  sessEl.textContent = sessioni+'/6';
  sessEl.style.color = sessioni>=4 ? 'var(--accent)' : sessioni>=2 ? 'var(--text)' : 'var(--text)';
}

// PESO CHART
function renderPesoChart(peso) {
  const wrap = document.getElementById('peso-chart-wrap');
  const ctx = document.getElementById('pesoChart');
  if(!ctx) return;
  if(pesoChart) { pesoChart.destroy(); pesoChart=null; }
  if(peso.length===0) {
    wrap.innerHTML='<div class="chart-empty">Nessun peso registrato ancora<br>Ogni venerdì mattina: + registra peso nell\'app</div>';
    return;
  }
  const labels = peso.map(p=>{const d=new Date(p.data);return d.getDate()+'/'+(d.getMonth()+1);});
  const values = peso.map(p=>p.peso);
  const minY = Math.min(78, ...values)-0.5;
  const maxY = Math.max(91, ...values)+0.5;

  Chart.defaults.color='#555350';
  Chart.defaults.borderColor='rgba(255,255,255,0.05)';

  pesoChart = new Chart(ctx, {
    type:'line',
    data:{
      labels,
      datasets:[
        {
          label:'Peso (kg)',
          data:values,
          borderColor:'#c8f564',
          backgroundColor:'rgba(200,245,100,0.07)',
          borderWidth:2,
          pointBackgroundColor:'#c8f564',
          pointBorderColor:'#0f0f0f',
          pointBorderWidth:1.5,
          pointRadius:5,
          tension:0.3,
          fill:true
        },
        {
          label:'Target 80 kg',
          data:Array(values.length).fill(80),
          borderColor:'rgba(255,107,107,0.45)',
          borderWidth:1.5,
          borderDash:[6,4],
          pointRadius:0,
          fill:false
        },
        {
          label:'Inizio 90 kg',
          data:Array(values.length).fill(90),
          borderColor:'rgba(255,255,255,0.1)',
          borderWidth:1,
          borderDash:[3,6],
          pointRadius:0,
          fill:false
        }
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:true,
      plugins:{
        legend:{display:true,position:'bottom',labels:{font:{family:'DM Mono',size:11},color:'#8a8780',boxWidth:16,padding:16}},
        tooltip:{backgroundColor:'#1a1a1a',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,titleColor:'#f0ede8',bodyColor:'#8a8780',padding:10,callbacks:{label:ctx=>' '+ctx.parsed.y+' kg'}}
      },
      scales:{
        x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{font:{family:'DM Mono',size:10},color:'#555350'}},
        y:{min:minY,max:maxY,grid:{color:'rgba(255,255,255,0.04)'},ticks:{font:{family:'DM Mono',size:10},color:'#555350',callback:v=>v+' kg',stepSize:1}}
      }
    }
  });
}

// MACRO BARS
function renderMacroBars(nutri) {
  const el = document.getElementById('macro-bars');
  if(!el) return;
  const days = Object.values(nutri);
  if(days.length===0) {
    el.innerHTML='<div class="chart-empty">Nessun pasto tracciato<br>Racconta i tuoi pasti al coach</div>'; return;
  }
  let totP=0,totC=0,totG=0,totK=0;
  days.forEach(day=>Object.values(day).forEach(m=>{totP+=m.proteine||0;totC+=m.carbo||0;totG+=m.grassi||0;totK+=m.kcal||0;}));
  const n=days.length;
  const avgP=Math.round(totP/n),avgC=Math.round(totC/n),avgG=Math.round(totG/n),avgK=Math.round(totK/n);

  function bar(label,val,tgt,unit) {
    const pct=Math.min(110,Math.round(val/tgt*100));
    const delta=val-tgt;
    const color=pct>=105?'var(--red)':pct>=80?'var(--accent)':'var(--text3)';
    const dStr=delta===0?'✓':(delta>0?'+':'')+delta+unit;
    const dCol=pct>=105?'var(--red)':pct>=80?'var(--accent)':'var(--text3)';
    return `<div class="mbar-item">
      <div class="mbar-header">
        <span class="mbar-label">${label}</span>
        <span class="mbar-val">${val}/${tgt}${unit} <span style="color:${dCol};font-size:10px;">${dStr}</span></span>
      </div>
      <div class="mbar-track"><div class="mbar-fill" style="width:${Math.min(100,pct)}%;background:${color};"></div></div>
    </div>`;
  }

  el.innerHTML=`<div class="mbar-note">Media su ${n} giorni tracciati</div>`+
    bar('Proteine',avgP,170,'g')+
    bar('Carboidrati',avgC,190,'g')+
    bar('Grassi',avgG,65,'g')+
    bar('Kcal',avgK,1975,' kcal');
}

// TRAINING WEEK
function renderTrainingWeek(log) {
  const el = document.getElementById('training-week');
  if(!el) return;
  const monday = getMonday(new Date());
  const dayNames = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  const dayTypes = ['FB-A','HIIT','FB-B','Riposo','FB-C','HIIT','FB-D'];
  const isRest = [false,false,false,true,false,false,false];

  const doneDays = new Set();
  log.forEach(entry=>{
    if(!entry.data||!entry.esercizi||entry.esercizi.length===0) return;
    const d=new Date(entry.data);
    if(d>=monday) { const dow=d.getDay(); doneDays.add(dow===0?6:dow-1); }
  });

  const today = new Date();
  const todayIdx = today.getDay()===0?6:today.getDay()-1;

  let html='<div class="week-grid">';
  for(let i=0;i<7;i++) {
    const done=doneDays.has(i);
    const rest=isRest[i];
    const past=i<todayIdx;
    const isToday=i===todayIdx;
    let cls='day-dot';
    if(done) cls+=' done';
    else if(rest) cls+=' rest';
    else if(past) cls+=' missed';
    if(isToday) cls+=' today';
    const icon=done?'✓':rest?'—':past?'·':'·';
    html+=`<div class="day-cell">
      <div class="day-name">${dayNames[i]}</div>
      <div class="${cls}">${icon}</div>
      <div class="day-type">${dayTypes[i]}</div>
    </div>`;
  }
  html+='</div>';
  el.innerHTML=html;
}

// ─── CONVERSAZIONI ─────────────────────────────────────────

async function loadConversations() {
  try {
    const res = await fetch(FB_URL+'/coach_ai_conversations.json');
    allData = (await res.json()) || {};
    renderSidebar();
    if(activeKey) renderConv(activeKey.t,activeKey.c);
  } catch(e) {
    document.getElementById('sidebar-content').innerHTML='<div style="padding:16px;font-size:13px;color:var(--red);">Errore Firebase</div>';
  }
}

function renderSidebar() {
  const el=document.getElementById('sidebar-content');
  if(!allData||Object.keys(allData).length===0){
    el.innerHTML='<div style="padding:16px;font-size:13px;color:var(--text3);">Nessuna conversazione ancora.</div>';return;
  }
  let html='';
  for(const trainer in allData){
    const clienti=allData[trainer];
    html+=`<div class="trainer-group"><div class="trainer-label">${trainer}</div>`;
    for(const cliente in clienti){
      const count=Object.keys(clienti[cliente]).length;
      const isActive=activeKey&&activeKey.t===trainer&&activeKey.c===cliente;
      html+=`<div class="cliente-item${isActive?' active':''}" onclick="selectCliente('${trainer}','${cliente}')">
        <span class="cliente-name">${cliente}</span>
        <span class="cliente-count">${count}</span>
      </div>`;
    }
    html+='</div>';
  }
  el.innerHTML=html;
}

function selectCliente(trainer,cliente){
  activeKey={t:trainer,c:cliente};
  renderSidebar();
  renderConv(trainer,cliente);
}

function renderConv(trainer,cliente){
  const msgs=allData[trainer]?.[cliente]||{};
  const sorted=Object.entries(msgs).sort((a,b)=>parseInt(a[0])-parseInt(b[0]));
  const cCount=sorted.filter(([,m])=>m.ruolo==='cliente').length;
  const aCount=sorted.filter(([,m])=>m.ruolo==='agente').length;
  const eCount=sorted.filter(([,m])=>m.ruolo==='agente'&&m.testo&&(m.testo.includes('SCALA AL TRAINER')||m.testo.includes('SCALA AL MEDICO'))).length;
  let html=`<div class="conv-header"><div class="conv-title">${cliente}</div><div class="conv-meta">Trainer: ${trainer}</div></div>
    <div class="stats-bar">
      <div class="stat"><span class="stat-val">${cCount}</span><span class="stat-label">cliente</span></div>
      <div class="stat"><span class="stat-val">${aCount}</span><span class="stat-label">agente</span></div>
      <div class="stat"><span class="stat-val" style="color:${eCount>0?'var(--red)':'var(--text)'}">${eCount}</span><span class="stat-label">escalation</span></div>
    </div><div class="conv-msgs">`;
  if(sorted.length===0){html+='<div class="empty-state">Nessun messaggio ancora.</div>';}
  else for(const [,msg] of sorted){
    const ruolo=msg.ruolo||'sistema';
    const testo=msg.testo||'';
    const ts=msg.ts?new Date(msg.ts).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
    const esc=testo.includes('SCALA AL TRAINER')||testo.includes('SCALA AL MEDICO');
    const rowCls=esc?'msg-row escalate':'msg-row '+ruolo;
    html+=`<div class="${rowCls}"><div class="msg-bubble">${testo.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div><span class="msg-ts">${ruolo} · ${ts}</span></div>`;
  }
  html+='</div>';
  document.getElementById('main').innerHTML=html;
}

reload();
setInterval(reload,30000);
</script>
