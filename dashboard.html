<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach AI · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222222;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#f0ede8;--text2:#8a8780;--text3:#555350;--accent:#c8f564;--accent-dim:rgba(200,245,100,0.12);--red:#ff6b6b;--red-dim:rgba(255,107,107,0.1);--radius:14px;--radius-sm:8px;--cp:#c8f564;--cc:#64b5f6;--cg:#ffb74d;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  .topbar{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);position:sticky;top:0;z-index:10;}
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .topbar-title{font-size:14px;font-weight:500;color:var(--accent);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.08em;}
  .topbar-right{display:flex;gap:8px;align-items:center;}
  .tab-btn{padding:5px 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.15s;}
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(200,245,100,0.3);}
  .refresh-btn{padding:5px 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;}
  .refresh-btn:hover{color:var(--accent);border-color:rgba(200,245,100,0.3);}

  #view-prog{padding:20px 24px;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .kpi-val{font-size:26px;font-weight:600;color:var(--accent);line-height:1;}
  .kpi-label{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;margin-top:5px;}
  .kpi-sub{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px;}

  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
  .chart-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--text2);font-family:'DM Mono',monospace;margin-bottom:16px;}
  .chart-empty{font-size:12px;color:var(--text3);text-align:center;padding:20px 0;font-family:'DM Mono',monospace;}

  /* DATE NAV */
  .date-nav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;}
  .date-nav-btn{background:transparent;border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text2);font-size:12px;font-family:'DM Mono',monospace;cursor:pointer;padding:5px 14px;transition:all 0.15s;}
  .date-nav-btn:hover{color:var(--accent);border-color:rgba(200,245,100,0.3);}
  .date-nav-btn:disabled{opacity:0.3;cursor:default;}
  .date-nav-center{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .date-nav-label{font-size:15px;font-weight:500;color:var(--text);}
  .date-nav-sub{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}

  /* PIE CHARTS GRID */
  .meals-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .meal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .meal-card-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--text2);font-family:'DM Mono',monospace;text-align:center;width:100%;}
  .meal-chart-wrap{position:relative;width:110px;height:110px;flex-shrink:0;}
  .meal-chart-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
  .meal-kcal-val{font-size:14px;font-weight:600;color:var(--text);line-height:1;}
  .meal-kcal-unit{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;}
  .meal-macros-table{width:100%;border-collapse:collapse;}
  .meal-macros-table td{font-size:10px;padding:2px 4px;font-family:'DM Mono',monospace;}
  .meal-macros-table .lbl{color:var(--text3);}
  .meal-macros-table .tgt{color:var(--text3);text-align:right;}
  .meal-macros-table .act{font-weight:500;text-align:right;}
  .meal-macros-table .act.ok{color:var(--accent);}
  .meal-macros-table .act.over{color:var(--red);}
  .meal-macros-table .act.low{color:var(--text2);}
  .meal-empty{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;text-align:center;padding:8px 0;}
  .meal-legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .legend-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;}
  .legend-item{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;display:flex;align-items:center;}

  /* WORKOUT */
  .wo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .wo-tipo{font-size:13px;font-weight:500;color:var(--accent);}
  .wo-ora{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
  .wo-exercises{display:flex;flex-direction:column;gap:6px;}
  .wo-ex{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);}
  .wo-ex-nome{font-size:13px;color:var(--text);}
  .wo-ex-detail{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}

  /* TRAINING WEEK */
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .day-cell{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .day-name{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;}
  .day-dot{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;transition:all 0.2s;}
  .day-dot.done{background:var(--accent-dim);border-color:rgba(200,245,100,0.4);color:var(--accent);}
  .day-dot.hiit{background:rgba(100,181,246,0.1);border-color:rgba(100,181,246,0.3);color:#64b5f6;}
  .day-dot.rest{background:transparent;border-color:var(--border);color:var(--text3);}
  .day-dot.today{box-shadow:0 0 0 2px rgba(200,245,100,0.2);}
  .day-dot.missed{background:rgba(255,107,107,0.06);border-color:rgba(255,107,107,0.15);color:var(--text3);}
  .day-type{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;text-align:center;line-height:1.3;}

  /* CONVERSAZIONI */
  #view-conv{height:calc(100vh - 57px);display:none;}
  .layout{display:flex;height:100%;}
  .sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;background:var(--surface);}
  .sidebar-header{padding:14px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--text2);font-family:'DM Mono',monospace;}
  .trainer-group{border-bottom:1px solid var(--border);}
  .trainer-label{padding:10px 16px 6px;font-size:12px;font-weight:500;color:var(--accent);font-family:'DM Mono',monospace;}
  .cliente-item{padding:8px 16px 8px 24px;cursor:pointer;transition:background 0.15s;display:flex;align-items:center;justify-content:space-between;}
  .cliente-item:hover{background:var(--surface2);}
  .cliente-item.active{background:var(--accent-dim);border-left:2px solid var(--accent);}
  .cliente-name{font-size:13px;color:var(--text);}
  .cliente-count{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
  .main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
  .main-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);}
  .conv-header{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
  .conv-title{font-size:15px;font-weight:500;color:var(--text);}
  .conv-meta{font-size:12px;color:var(--text2);margin-top:3px;font-family:'DM Mono',monospace;}
  .conv-msgs{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:10px;}
  .msg-row{display:flex;flex-direction:column;max-width:65%;}
  .msg-row.cliente{align-self:flex-end;align-items:flex-end;}
  .msg-row.agente{align-self:flex-start;align-items:flex-start;}
  .msg-row.sistema{align-self:center;align-items:center;}
  .msg-bubble{padding:9px 13px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
  .msg-row.cliente .msg-bubble{background:var(--accent);color:#0f0f0f;border-radius:16px 16px 4px 16px;}
  .msg-row.agente .msg-bubble{background:var(--surface2);color:var(--text);border-radius:16px 16px 16px 4px;border:1px solid var(--border);}
  .msg-row.sistema .msg-bubble{background:transparent;color:var(--text3);font-size:11px;font-family:'DM Mono',monospace;padding:4px 8px;}
  .msg-row.escalate .msg-bubble{background:var(--red-dim);border-color:rgba(255,107,107,0.2);color:var(--red);}
  .msg-ts{font-size:10px;color:var(--text3);margin-top:3px;font-family:'DM Mono',monospace;}
  .stats-bar{padding:10px 24px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;gap:24px;flex-shrink:0;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat-val{font-size:18px;font-weight:600;color:var(--text);}
  .stat-label{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;}
  .empty-state{color:var(--text3);font-size:13px;text-align:center;margin-top:40px;}

  @media(max-width:900px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .meals-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media(max-width:600px){
    .meals-grid{grid-template-columns:1fr 1fr;}
    #view-prog{padding:12px;}
    .sidebar{width:160px;}
    .day-dot{width:28px;height:28px;font-size:11px;}
  }
  @media(max-width:400px){
    .meals-grid{grid-template-columns:1fr;}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo-dot"></div>
    <span class="topbar-title">Coach AI · Dashboard</span>
  </div>
  <div class="topbar-right">
    <button class="tab-btn active" id="tab-prog" onclick="showTab('prog')">Progressi</button>
    <button class="tab-btn" id="tab-conv" onclick="showTab('conv')">Conversazioni</button>
    <button class="refresh-btn" onclick="reload()">↻</button>
  </div>
</div>

<!-- PROGRESSI VIEW -->
<div id="view-prog">

  <div class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-val" id="kpi-peso">—</div>
      <div class="kpi-label">Peso attuale</div>
      <div class="kpi-sub" id="kpi-peso-data"></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpi-perso" style="color:var(--text);">—</div>
      <div class="kpi-label">Kg persi</div>
      <div class="kpi-sub">da 90 kg</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpi-rimanenti" style="color:var(--text);">—</div>
      <div class="kpi-label">Al target</div>
      <div class="kpi-sub">obiettivo 80 kg</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpi-sessioni" style="color:var(--text);">—</div>
      <div class="kpi-label">Sessioni settimana</div>
      <div class="kpi-sub">target 6/sett.</div>
    </div>
  </div>

  <!-- Peso chart -->
  <div class="chart-card">
    <div class="chart-title">Peso nel tempo · verso 80 kg</div>
    <div id="peso-chart-wrap"><canvas id="pesoChart" height="80"></canvas></div>
  </div>

  <!-- Date nav -->
  <div class="date-nav">
    <button class="date-nav-btn" onclick="changeDate(-1)">← Prec</button>
    <div class="date-nav-center">
      <span class="date-nav-label" id="date-nav-label">—</span>
      <span class="date-nav-sub" id="date-nav-sub"></span>
    </div>
    <button class="date-nav-btn" id="btn-next" onclick="changeDate(1)">Succ →</button>
  </div>

  <!-- 6 Pie charts pasti -->
  <div class="meals-grid" id="meals-grid"></div>

  <!-- Allenamento del giorno -->
  <div class="chart-card">
    <div class="chart-title">Allenamento del giorno</div>
    <div id="workout-giorno"></div>
  </div>

  <!-- Settimana corrente -->
  <div class="chart-card">
    <div class="chart-title">Settimana corrente · allenamenti</div>
    <div id="training-week"></div>
  </div>

</div>

<!-- CONVERSAZIONI VIEW -->
<div id="view-conv">
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">Trainer · Clienti</div>
      <div id="sidebar-content"><div style="padding:16px;font-size:13px;color:var(--text3);">Caricamento...</div></div>
    </div>
    <div class="main" id="main">
      <div class="main-empty"><p style="font-size:14px;">Seleziona un cliente</p></div>
    </div>
  </div>
</div>

<script>
const FB_URL = 'https://casa-manager-24414-default-rtdb.europe-west1.firebasedatabase.app';
const CLIENT_KEYS = ['fabrizio_test', 'fabrizio_fabrizio'];
const ROTATION_START = '2026-05-11';
const ROTATION = [
  {label:'Full Body 1', type:'fb',   p:170, c:210, g:65, k:2050},
  {label:'HIIT+Addome', type:'hiit', p:170, c:185, g:65, k:1950},
  {label:'Riposo attivo',type:'rest',p:170, c:170, g:65, k:1850},
  {label:'Full Body 2', type:'fb',   p:170, c:210, g:65, k:2050},
  {label:'HIIT+Addome', type:'hiit', p:170, c:185, g:65, k:1950},
  {label:'Riposo attivo',type:'rest',p:170, c:170, g:65, k:1850},
  {label:'Full Body 3', type:'fb',   p:170, c:210, g:65, k:2050},
  {label:'HIIT+Addome', type:'hiit', p:170, c:185, g:65, k:1950},
  {label:'Riposo attivo',type:'rest',p:170, c:170, g:65, k:1850},
  {label:'Full Body 4', type:'fb',   p:170, c:210, g:65, k:2050},
  {label:'HIIT+Addome', type:'hiit', p:170, c:185, g:65, k:1950},
  {label:'Riposo attivo',type:'rest',p:170, c:170, g:65, k:1850},
];

// target per singolo pasto (P g, C g, G g, kcal) — FB day / rest day
const MEAL_TARGETS = {
  fb: {
    colazione:     {p:40, c:45, g:15, k:475},
    spuntino_matt: {p:15, c:20, g:5,  k:185},
    pranzo:        {p:55, c:85, g:20, k:740},
    spuntino_pom:  {p:15, c:20, g:5,  k:185},
    cena:          {p:45, c:35, g:20, k:500},
    spuntino_serale:{p:0,  c:5,  g:0,  k:0},
  },
  hiit: {
    colazione:     {p:40, c:40, g:14, k:450},
    spuntino_matt: {p:15, c:18, g:5,  k:177},
    pranzo:        {p:55, c:75, g:20, k:700},
    spuntino_pom:  {p:15, c:18, g:5,  k:177},
    cena:          {p:45, c:30, g:20, k:476},
    spuntino_serale:{p:0,  c:4,  g:0,  k:0},
  },
  rest: {
    colazione:     {p:35, c:35, g:12, k:390},
    spuntino_matt: {p:15, c:15, g:5,  k:165},
    pranzo:        {p:50, c:70, g:18, k:650},
    spuntino_pom:  {p:15, c:15, g:5,  k:165},
    cena:          {p:50, c:30, g:20, k:500},
    spuntino_serale:{p:0,  c:5,  g:0,  k:0},
  }
};
const MEAL_LABELS = {
  colazione:'Colazione', spuntino_matt:'Spuntino matt.',
  pranzo:'Pranzo', spuntino_pom:'Spuntino pom.',
  cena:'Cena', spuntino_serale:'Spuntino serale'
};
const MEAL_ORDER = ['colazione','spuntino_matt','pranzo','spuntino_pom','cena','spuntino_serale'];

let allData = {};
let activeKey = null;
let pesoChart = null;
let mealCharts = {};
let selectedDate = todayStr();
let nutriAll = {};
let logAll = [];

function todayStr() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr+'T12:00:00');
  const days=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const months=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  return days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()];
}

function getRotationDay(dateStr) {
  const start = new Date(ROTATION_START+'T00:00:00');
  const d = new Date((dateStr||todayStr())+'T00:00:00');
  d.setHours(0,0,0,0); start.setHours(0,0,0,0);
  const days = Math.max(0, Math.floor((d - start) / 86400000));
  return ROTATION[days % 12];
}

function changeDate(delta) {
  const d = new Date(selectedDate+'T12:00:00');
  d.setDate(d.getDate()+delta);
  const s = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(s > todayStr()) return;
  selectedDate = s;
  updateDateNav();
  renderMealsGiorno();
  renderWorkoutGiorno();
}

function updateDateNav() {
  const isToday = selectedDate === todayStr();
  const rot = getRotationDay(selectedDate);
  document.getElementById('date-nav-label').textContent = isToday ? 'Oggi · '+formatDateLabel(selectedDate) : formatDateLabel(selectedDate);
  document.getElementById('date-nav-sub').textContent = rot.label+' · target '+rot.k+' kcal';
  document.getElementById('btn-next').disabled = isToday;
}

function showTab(tab) {
  document.getElementById('view-prog').style.display = tab==='prog'?'flex':'none';
  document.getElementById('view-conv').style.display = tab==='conv'?'block':'none';
  document.getElementById('tab-prog').className='tab-btn'+(tab==='prog'?' active':'');
  document.getElementById('tab-conv').className='tab-btn'+(tab==='conv'?' active':'');
}

async function reload() {
  loadProgressi();
  loadConversations();
}

// ─── PROGRESSI ────────────────────────────────────────────

async function loadProgressi() {
  const [peso, nutri, log] = await Promise.all([fetchPeso(), fetchNutri(), fetchLog()]);
  nutriAll = nutri;
  logAll = log;
  renderKPI(peso, log);
  renderPesoChart(peso);
  updateDateNav();
  renderMealsGiorno();
  renderWorkoutGiorno();
  renderTrainingWeek(log);
}

async function fetchFromKeys(path) {
  const results = await Promise.all(
    CLIENT_KEYS.map(k => fetch(FB_URL+'/'+path+'/'+k+'.json').then(r=>r.json()).catch(()=>null))
  );
  return results;
}

async function fetchPeso() {
  try {
    const results = await fetchFromKeys('coach_ai_peso');
    const byDate = {};
    results.forEach(d => {
      if(!d) return;
      Object.values(d).forEach(e => {
        if(e && e.data && e.peso != null && !isNaN(e.peso))
          byDate[e.data] = e;
      });
    });
    return Object.values(byDate).sort((a,b)=>new Date(a.data)-new Date(b.data));
  } catch(e){return[];}
}

async function fetchNutri() {
  try {
    const results = await fetchFromKeys('coach_ai_nutri');
    const merged = {};
    results.forEach(d => {
      if(!d) return;
      Object.entries(d).forEach(([date, meals]) => {
        if(!merged[date]) merged[date] = {};
        Object.assign(merged[date], meals);
      });
    });
    return merged;
  } catch(e){return{};}
}

async function fetchLog() {
  try {
    const results = await fetchFromKeys('coach_ai_log');
    const merged = [];
    results.forEach(d => { if(d) merged.push(...Object.values(d)); });
    return merged;
  } catch(e){return[];}
}

function getMonday(d) {
  const day=new Date(d), dow=day.getDay();
  day.setDate(day.getDate()-(dow===0?6:dow-1)); day.setHours(0,0,0,0);
  return day;
}

// KPI
function renderKPI(peso, log) {
  const last = peso[peso.length-1];
  if(last&&last.peso!=null&&!isNaN(last.peso)){
    const perso=+(90-last.peso).toFixed(1);
    const rim=+(last.peso-80).toFixed(1);
    document.getElementById('kpi-peso').textContent=last.peso+' kg';
    document.getElementById('kpi-peso-data').textContent=last.data||'';
    const pe=document.getElementById('kpi-perso');
    pe.textContent=perso>0?'-'+perso+' kg':perso<0?'+'+Math.abs(perso)+' kg':'0 kg';
    pe.style.color=perso>0?'var(--accent)':'var(--red)';
    const re=document.getElementById('kpi-rimanenti');
    re.textContent=rim>0?rim+' kg':'TARGET!';
    re.style.color=rim<=2?'var(--accent)':'var(--text)';
  }
  const monday=getMonday(new Date());
  const sess=log.filter(e=>e.data&&new Date(e.data)>=monday&&e.esercizi&&e.esercizi.length>0).length;
  const se=document.getElementById('kpi-sessioni');
  se.textContent=sess+'/6';
  se.style.color=sess>=4?'var(--accent)':'var(--text)';
}

// PESO CHART
function renderPesoChart(peso) {
  const wrap=document.getElementById('peso-chart-wrap');
  if(pesoChart){pesoChart.destroy();pesoChart=null;}
  if(peso.length===0){
    wrap.innerHTML='<div class="chart-empty">Nessun peso registrato · Ogni venerdì mattina nell\'app</div>';return;
  }
  if(!wrap.querySelector('canvas')) wrap.innerHTML='<canvas id="pesoChart" height="80"></canvas>';
  const ctx=document.getElementById('pesoChart');
  const labels=peso.map(p=>{const d=new Date(p.data);return d.getDate()+'/'+(d.getMonth()+1);});
  const vals=peso.map(p=>p.peso);
  const minY=Math.min(78,...vals)-0.5, maxY=Math.max(91,...vals)+0.5;
  Chart.defaults.color='#555350'; Chart.defaults.borderColor='rgba(255,255,255,0.05)';
  pesoChart=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[
      {label:'Peso (kg)',data:vals,borderColor:'#c8f564',backgroundColor:'rgba(200,245,100,0.07)',borderWidth:2,pointBackgroundColor:'#c8f564',pointBorderColor:'#0f0f0f',pointBorderWidth:1.5,pointRadius:5,tension:0.3,fill:true},
      {label:'Target 80 kg',data:Array(vals.length).fill(80),borderColor:'rgba(255,107,107,0.45)',borderWidth:1.5,borderDash:[6,4],pointRadius:0,fill:false},
      {label:'Inizio 90 kg',data:Array(vals.length).fill(90),borderColor:'rgba(255,255,255,0.1)',borderWidth:1,borderDash:[3,6],pointRadius:0,fill:false}
    ]},
    options:{responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:true,position:'bottom',labels:{font:{family:'DM Mono',size:11},color:'#8a8780',boxWidth:16,padding:16}},
        tooltip:{backgroundColor:'#1a1a1a',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,titleColor:'#f0ede8',bodyColor:'#8a8780',padding:10,callbacks:{label:c=>' '+c.parsed.y+' kg'}}},
      scales:{x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{font:{family:'DM Mono',size:10},color:'#555350'}},
        y:{min:minY,max:maxY,grid:{color:'rgba(255,255,255,0.04)'},ticks:{font:{family:'DM Mono',size:10},color:'#555350',callback:v=>v+' kg',stepSize:1}}}
    }
  });
}

// MEAL PIE CHARTS
function renderMealsGiorno() {
  const rot = getRotationDay(selectedDate);
  const targets = MEAL_TARGETS[rot.type] || MEAL_TARGETS.rest;
  const dayMeals = nutriAll[selectedDate] || {};

  // group by tipo_pasto
  const grouped = {};
  MEAL_ORDER.forEach(k => grouped[k] = []);
  Object.values(dayMeals).forEach(m => {
    const key = m.tipo_pasto || m.pasto || '';
    const mapped = mapPasto(key);
    if(grouped[mapped]) grouped[mapped].push(m);
  });

  // destroy old charts
  Object.values(mealCharts).forEach(c=>{try{c.destroy();}catch(e){}});
  mealCharts = {};

  const grid = document.getElementById('meals-grid');
  grid.innerHTML = MEAL_ORDER.map(slot => `
    <div class="meal-card">
      <div class="meal-card-title">${MEAL_LABELS[slot]}</div>
      <div class="meal-chart-wrap">
        <canvas id="chart-${slot}" width="110" height="110"></canvas>
        <div class="meal-chart-center">
          <div class="meal-kcal-val" id="kcal-${slot}">—</div>
          <div class="meal-kcal-unit">kcal</div>
        </div>
      </div>
      <table class="meal-macros-table">
        <tr>
          <td class="lbl"></td>
          <td class="tgt" style="color:var(--text3);font-size:9px;">target</td>
          <td class="act" style="font-size:9px;color:var(--text3);">reale</td>
        </tr>
        <tr>
          <td class="lbl" style="color:var(--cp);">Prot</td>
          <td class="tgt">${targets[slot].p}g</td>
          <td class="act" id="act-p-${slot}">—</td>
        </tr>
        <tr>
          <td class="lbl" style="color:var(--cc);">Carbo</td>
          <td class="tgt">${targets[slot].c}g</td>
          <td class="act" id="act-c-${slot}">—</td>
        </tr>
        <tr>
          <td class="lbl" style="color:var(--cg);">Grassi</td>
          <td class="tgt">${targets[slot].g}g</td>
          <td class="act" id="act-g-${slot}">—</td>
        </tr>
      </table>
    </div>
  `).join('');

  MEAL_ORDER.forEach(slot => {
    const meals = grouped[slot];
    const tgt = targets[slot];
    let totP=0, totC=0, totG=0, totK=0;
    meals.forEach(m=>{totP+=m.proteine||0;totC+=m.carbo||0;totG+=m.grassi||0;totK+=m.kcal||0;});
    const hasData = meals.length > 0;

    // kcal from macros (more accurate)
    const kP=totP*4, kC=totC*4, kG=totG*9;
    const kTotal = hasData ? Math.round(totK||kP+kC+kG) : 0;
    // target kcal from macros
    const tkP=tgt.p*4, tkC=tgt.c*4, tkG=tgt.g*9;

    document.getElementById('kcal-'+slot).textContent = hasData ? kTotal : tgt.k||'—';

    // macro cells
    function setCell(id, val, tgtVal) {
      const el = document.getElementById(id);
      if(!el) return;
      if(!hasData){el.textContent='—';el.className='act';return;}
      el.textContent = val+'g';
      const pct = tgtVal>0?val/tgtVal:0;
      el.className = 'act '+(pct>1.1?'over':pct>=0.75?'ok':'low');
    }
    setCell('act-p-'+slot, Math.round(totP), tgt.p);
    setCell('act-c-'+slot, Math.round(totC), tgt.c);
    setCell('act-g-'+slot, Math.round(totG), tgt.g);

    const ctx = document.getElementById('chart-'+slot);
    if(!ctx) return;

    const useP = hasData ? kP : tkP;
    const useC = hasData ? kC : tkC;
    const useG = hasData ? kG : tkG;
    const total = useP+useC+useG;

    const alpha = hasData ? 1 : 0.3;
    mealCharts[slot] = new Chart(ctx, {
      type:'doughnut',
      data:{
        labels:['Proteine','Carboidrati','Grassi'],
        datasets:[{
          data: total>0 ? [useP,useC,useG] : [1,1,1],
          backgroundColor:[
            `rgba(200,245,100,${alpha})`,
            `rgba(100,181,246,${alpha})`,
            `rgba(255,183,77,${alpha})`
          ],
          borderColor:'#1a1a1a',
          borderWidth:2,
          hoverOffset:4
        }]
      },
      options:{
        responsive:false,
        cutout:'68%',
        plugins:{
          legend:{display:false},
          tooltip:{enabled:total>3,backgroundColor:'#1a1a1a',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,titleColor:'#f0ede8',bodyColor:'#8a8780',padding:8,
            callbacks:{label:c=>{
              const pct=Math.round(c.parsed/(useP+useC+useG)*100);
              return ' '+c.label+': '+Math.round(c.parsed/4)+' kcal ('+pct+'%)';
            }}
          }
        }
      }
    });
  });
}

function mapPasto(key) {
  key = (key||'').toLowerCase();
  if(key.includes('colazione')) return 'colazione';
  if(key.includes('spuntino_matt')||key.includes('spuntino matt')||(key.includes('spuntino')&&(key.includes('matt')||key.includes('morn')))) return 'spuntino_matt';
  if(key==='pranzo'||key.includes('pranzo')) return 'pranzo';
  if(key.includes('spuntino_pom')||key.includes('spuntino pom')||(key.includes('spuntino')&&key.includes('pom'))) return 'spuntino_pom';
  if(key==='cena'||key.includes('cena')) return 'cena';
  if(key.includes('spuntino_serale')||key.includes('serale')) return 'spuntino_serale';
  if(key.includes('spuntino')) return 'spuntino_pom';
  return 'altro';
}

// WORKOUT GIORNALIERO
function renderWorkoutGiorno() {
  const el = document.getElementById('workout-giorno');
  if(!el) return;
  const entries = logAll.filter(e=>e.data===selectedDate&&e.esercizi&&e.esercizi.length>0);
  if(entries.length===0){
    const rot = getRotationDay(selectedDate);
    el.innerHTML = rot.type==='rest'
      ? '<div class="chart-empty">Giorno di riposo · Recupero attivo</div>'
      : '<div class="chart-empty">Nessun allenamento registrato per questo giorno</div>';
    return;
  }
  let html='';
  entries.forEach(entry=>{
    html+=`<div class="wo-header"><span class="wo-tipo">${entry.sessione||entry.tipo||'Allenamento'}</span><span class="wo-ora">${entry.ora||''}</span></div><div class="wo-exercises">`;
    entry.esercizi.forEach(ex=>{
      const d=[ex.serie?ex.serie+'×':null,ex.rip||ex.reps?((ex.rip||ex.reps)+' rip'):null,ex.carico_kg>0?ex.carico_kg+' kg':ex.kg?ex.kg+' kg':null].filter(Boolean).join(' ');
      html+=`<div class="wo-ex"><span class="wo-ex-nome">${ex.nome||'Esercizio'}</span><span class="wo-ex-detail">${d}</span></div>`;
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

// TRAINING WEEK
function renderTrainingWeek(log) {
  const el = document.getElementById('training-week');
  if(!el) return;
  const monday = getMonday(new Date());
  const today = new Date(); today.setHours(0,0,0,0);
  const days=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];

  const logByDate = {};
  log.forEach(e=>{
    if(e.data&&e.esercizi&&e.esercizi.length>0){
      logByDate[e.data] = e.sessione||e.tipo||'✓';
    }
  });

  let html='<div class="week-grid">';
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(d.getDate()+i); d.setHours(0,0,0,0);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const rot=getRotationDay(ds);
    const isToday=d.getTime()===today.getTime();
    const isPast=d<today;
    const entry=logByDate[ds];
    let cls='day-dot';
    let icon='·';
    if(entry){
      const low=(entry||'').toLowerCase();
      if(low.includes('hiit')){cls+=' hiit';icon='H';}
      else if(rot.type==='rest'){cls+=' rest';icon='—';}
      else{cls+=' done';icon='✓';}
    } else if(rot.type==='rest'){cls+=' rest';icon='—';}
    else if(isPast) cls+=' missed';
    if(isToday) cls+=' today';
    const typeLabel=rot.label.replace('Full Body','FB').replace('Riposo attivo','Riposo').replace('HIIT+Addome','HIIT');
    html+=`<div class="day-cell">
      <div class="day-name">${days[i]}</div>
      <div class="${cls}">${icon}</div>
      <div class="day-type">${typeLabel}</div>
    </div>`;
  }
  html+='</div>';
  el.innerHTML=html;
}

// ─── CONVERSAZIONI ─────────────────────────────────────────

async function loadConversations() {
  try {
    const r=await fetch(FB_URL+'/coach_ai_conversations.json');
    allData=(await r.json())||{};
    renderSidebar();
    if(activeKey) renderConv(activeKey.t,activeKey.c);
  } catch(e){
    document.getElementById('sidebar-content').innerHTML='<div style="padding:16px;font-size:13px;color:var(--red);">Errore Firebase</div>';
  }
}

function renderSidebar(){
  const el=document.getElementById('sidebar-content');
  if(!allData||Object.keys(allData).length===0){el.innerHTML='<div style="padding:16px;font-size:13px;color:var(--text3);">Nessuna conversazione.</div>';return;}
  let html='';
  for(const t in allData){
    const cl=allData[t];
    html+=`<div class="trainer-group"><div class="trainer-label">${t}</div>`;
    for(const c in cl){
      const cnt=Object.keys(cl[c]).length;
      const act=activeKey&&activeKey.t===t&&activeKey.c===c;
      html+=`<div class="cliente-item${act?' active':''}" onclick="selectCliente('${t}','${c}')"><span class="cliente-name">${c}</span><span class="cliente-count">${cnt}</span></div>`;
    }
    html+='</div>';
  }
  el.innerHTML=html;
}

function selectCliente(t,c){activeKey={t,c};renderSidebar();renderConv(t,c);}

function renderConv(t,c){
  const msgs=allData[t]?.[c]||{};
  const sorted=Object.entries(msgs).sort((a,b)=>parseInt(a[0])-parseInt(b[0]));
  const cC=sorted.filter(([,m])=>m.ruolo==='cliente').length;
  const aC=sorted.filter(([,m])=>m.ruolo==='agente').length;
  const eC=sorted.filter(([,m])=>m.ruolo==='agente'&&m.testo&&(m.testo.includes('SCALA AL TRAINER')||m.testo.includes('SCALA AL MEDICO'))).length;
  let html=`<div class="conv-header"><div class="conv-title">${c}</div><div class="conv-meta">Trainer: ${t}</div></div>
    <div class="stats-bar">
      <div class="stat"><span class="stat-val">${cC}</span><span class="stat-label">cliente</span></div>
      <div class="stat"><span class="stat-val">${aC}</span><span class="stat-label">agente</span></div>
      <div class="stat"><span class="stat-val" style="color:${eC>0?'var(--red)':'var(--text)'}">${eC}</span><span class="stat-label">escalation</span></div>
    </div><div class="conv-msgs">`;
  if(!sorted.length) html+='<div class="empty-state">Nessun messaggio.</div>';
  else for(const[,msg] of sorted){
    const r=msg.ruolo||'sistema',tx=msg.testo||'';
    const ts=msg.ts?new Date(msg.ts).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
    const esc=tx.includes('SCALA AL TRAINER')||tx.includes('SCALA AL MEDICO');
    html+=`<div class="${esc?'msg-row escalate':'msg-row '+r}"><div class="msg-bubble">${tx.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div><span class="msg-ts">${r} · ${ts}</span></div>`;
  }
  html+='</div>';
  document.getElementById('main').innerHTML=html;
}

reload();
setInterval(reload,30000);
